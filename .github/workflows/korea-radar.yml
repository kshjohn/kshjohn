name: Korea Radar data

# 3시간마다 Google 뉴스 폴란드판을 수집해 radar-data 브랜치의 data.json을 갱신한다.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "korea-radar/collect.mjs"
      - "korea-radar/index.html"
      - ".github/workflows/korea-radar.yml"

permissions:
  contents: write

concurrency:
  group: korea-radar-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect headlines
        run: |
          mkdir -p out
          node korea-radar/collect.mjs korea-radar/index.html out/data.json \
            "https://raw.githubusercontent.com/${{ github.repository }}/radar-data/data.json"
      # main에서 돌 때만 게시한다. 다른 브랜치에서는 수집 결과를 로그로만 확인.
      - name: Publish to radar-data branch
        if: github.ref == 'refs/heads/main'
        run: |
          cd out
          git init -q -b radar-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -q -m "Update Korea Radar data"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" radar-data

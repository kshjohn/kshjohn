<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Polski A1–C1 · 폴란드어 자습실</title>
<meta name="description" content="A1부터 C1까지 혼자 익히는 폴란드어 학습 앱 — 단어·7격·어미·문법·훈련·퀴즈·모의고사. 설치하면 오프라인에서도 돌아갑니다.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FCFCFD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1012" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Polski">
<meta name="format-detection" content="telephone=no">
<style>
  html{background:#FCFCFD}
  body{margin:0;padding:0;background:#FCFCFD;color:#191A1C;
       font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  img{max-width:100%}
  [hidden]{display:none!important}
  @media (prefers-color-scheme:dark){
    html,body{background:#0F1012;color:#F0F0F2}
  }
</style>
</head>
<body>
<style>
/* ============ TOKENS ============ */
:root{
  --paper:#FCFCFD; --card:#FFFFFF; --wash:#F6F7F9;
  --ink:#191A1C; --ink-2:#5B616E; --ink-3:#8E939E;
  --line:#ECEDF0; --line-2:#F3F4F6; --grid:transparent;
  --carmine:#D42B4E; --carmine-soft:#FDF2F4;
  --amber:#B7791F; --amber-soft:#FDF8EC;
  --good:#12855F; --good-soft:#EFF9F4;
  --bad:#D42B4E; --bad-soft:#FDF2F4;
  --c1:#3B6FE0; --c2:#D42B4E; --c3:#B7791F; --c4:#12855F;
  --c5:#7C4DDB; --c6:#0E8AA0; --c7:#CC6329;
  --shadow-xs:0 1px 2px rgba(17,24,39,.05);
  --shadow:0 1px 2px rgba(17,24,39,.04), 0 4px 10px -2px rgba(17,24,39,.06);
  --shadow-md:0 2px 4px rgba(17,24,39,.04), 0 12px 26px -8px rgba(17,24,39,.10);
  --r2xl:16px; --rlg:12px; --rmd:10px; --rsm:8px; --rxs:6px;
  --font-ui:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",
            "Noto Sans KR","Malgun Gothic",Roboto,sans-serif;
  --font-pl:var(--font-ui);
  --font-disp:var(--font-ui);
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0F1012; --card:#17181B; --wash:#1C1D21;
    --ink:#F0F0F2; --ink-2:#B4B8C0; --ink-3:#82868F;
    --line:#26282D; --line-2:#1F2125; --grid:transparent;
    --carmine:#FF6B87; --carmine-soft:#2A1419;
    --amber:#E0A93E; --amber-soft:#241C0D;
    --good:#3DBE8B; --good-soft:#0E241B;
    --bad:#FF6B87; --bad-soft:#2A1419;
    --c1:#6E9BF0; --c2:#FF6B87; --c3:#E0A93E; --c4:#3DBE8B;
    --c5:#A98AEC; --c6:#3FB2C7; --c7:#E8894F;
    --shadow-xs:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 4px 12px -2px rgba(0,0,0,.4);
    --shadow-md:0 2px 6px rgba(0,0,0,.4), 0 14px 30px -8px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --paper:#0F1012; --card:#17181B; --wash:#1C1D21;
  --ink:#F0F0F2; --ink-2:#B4B8C0; --ink-3:#82868F;
  --line:#26282D; --line-2:#1F2125; --grid:transparent;
  --carmine:#FF6B87; --carmine-soft:#2A1419;
  --amber:#E0A93E; --amber-soft:#241C0D;
  --good:#3DBE8B; --good-soft:#0E241B;
  --bad:#FF6B87; --bad-soft:#2A1419;
  --c1:#6E9BF0; --c2:#FF6B87; --c3:#E0A93E; --c4:#3DBE8B;
  --c5:#A98AEC; --c6:#3FB2C7; --c7:#E8894F;
  --shadow-xs:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 4px 12px -2px rgba(0,0,0,.4);
  --shadow-md:0 2px 6px rgba(0,0,0,.4), 0 14px 30px -8px rgba(0,0,0,.55);
}
:root[data-theme="light"]{
  --paper:#FCFCFD; --card:#FFFFFF; --wash:#F6F7F9;
  --ink:#191A1C; --ink-2:#5B616E; --ink-3:#8E939E;
  --line:#ECEDF0; --line-2:#F3F4F6; --grid:transparent;
  --carmine:#D42B4E; --carmine-soft:#FDF2F4;
  --amber:#B7791F; --amber-soft:#FDF8EC;
  --good:#12855F; --good-soft:#EFF9F4;
  --bad:#D42B4E; --bad-soft:#FDF2F4;
  --c1:#3B6FE0; --c2:#D42B4E; --c3:#B7791F; --c4:#12855F;
  --c5:#7C4DDB; --c6:#0E8AA0; --c7:#CC6329;
  --shadow-xs:0 1px 2px rgba(17,24,39,.05);
  --shadow:0 1px 2px rgba(17,24,39,.04), 0 4px 10px -2px rgba(17,24,39,.06);
  --shadow-md:0 2px 4px rgba(17,24,39,.04), 0 12px 26px -8px rgba(17,24,39,.10);
}

/* ============ BASE ============ */
*{box-sizing:border-box}
html{background:var(--paper)}
body{
  margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
  font-family:var(--font-ui); font-size:15px; line-height:1.65;
  letter-spacing:-.006em;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--carmine); outline-offset:2px; border-radius:var(--rsm)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 폴란드어는 조밀하고 진하게, 한국어 설명은 가볍고 흐리게 — 서체가 아니라 위계로 구분 */
.pl{font-family:var(--font-pl);letter-spacing:-.018em;font-feature-settings:"kern" 1}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}

/* ============ SHELL ============ */
.wrap{max-width:1000px;margin:0 auto;padding:0 24px 120px}
header.top{
  border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--paper) 82%,transparent);
  backdrop-filter:saturate(180%) blur(12px);position:sticky;top:0;z-index:30
}
.top-in{max-width:1000px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .flag{width:20px;height:14px;border-radius:3px;overflow:hidden;flex:none;
  background:linear-gradient(to bottom,#fff 0 50%,var(--carmine) 50% 100%);
  box-shadow:inset 0 0 0 1px rgba(17,24,39,.10)}
.brand h1{font-size:16.5px;letter-spacing:-.022em;margin:0;font-weight:700}
.brand span{font-size:12.5px;color:var(--ink-3);font-weight:500}
nav.tabs{display:flex;gap:3px;flex-wrap:wrap}
nav.tabs button{
  background:none;border:none;padding:7px 13px;cursor:pointer;color:var(--ink-3);
  font-weight:550;font-size:14px;border-radius:var(--rsm);
  transition:background .13s ease,color .13s ease
}
nav.tabs button:hover{color:var(--ink);background:var(--wash)}
nav.tabs button[aria-current="true"]{color:var(--ink);background:var(--wash);font-weight:650}
.icon-btn{
  background:var(--card);border:1px solid var(--line);border-radius:var(--rmd);
  padding:6px 11px;cursor:pointer;font-size:13px;color:var(--ink-2);font-weight:500;
  box-shadow:var(--shadow-xs);transition:border-color .13s ease,box-shadow .13s ease
}
.icon-btn:hover{border-color:#D8DAE0;box-shadow:var(--shadow)}
:root[data-theme="dark"] .icon-btn:hover{border-color:#3A3D45}

/* ============ CARDS / PRIMITIVES ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2xl);box-shadow:var(--shadow)}
.pad{padding:28px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(232px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(176px,1fr))}

h2.sec{font-size:21px;font-weight:680;margin:64px 0 6px;letter-spacing:-.02em;line-height:1.3;text-wrap:balance}
h2.sec:first-child{margin-top:44px}
p.lede{color:var(--ink-2);margin:0 0 22px;font-size:14.5px;line-height:1.7;max-width:64ch}

.btn{
  background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:var(--rmd);
  padding:10px 18px;font-weight:600;cursor:pointer;font-size:14px;letter-spacing:-.01em;
  box-shadow:var(--shadow-xs);transition:opacity .13s ease,box-shadow .13s ease
}
.btn:hover{opacity:.86;box-shadow:var(--shadow)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:#D8DAE0;opacity:1}
:root[data-theme="dark"] .btn.ghost:hover{border-color:#3A3D45}
.btn.red{background:var(--carmine);border-color:var(--carmine);color:#fff}
:root[data-theme="dark"] .btn:not(.ghost):not(.know):not(.dunno){color:#0F1012}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .btn:not(.ghost):not(.know):not(.dunno){color:#0F1012}
}
.btn:disabled{opacity:.38;cursor:not-allowed;box-shadow:none}

.chip{
  display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.01em;
  padding:3px 9px;border:1px solid var(--line);border-radius:999px;color:var(--ink-3);white-space:nowrap
}
.chip.m{color:var(--c1);border-color:color-mix(in srgb,var(--c1) 28%,transparent);background:color-mix(in srgb,var(--c1) 7%,transparent)}
.chip.f{color:var(--c2);border-color:color-mix(in srgb,var(--c2) 28%,transparent);background:color-mix(in srgb,var(--c2) 7%,transparent)}
.chip.n{color:var(--c4);border-color:color-mix(in srgb,var(--c4) 28%,transparent);background:color-mix(in srgb,var(--c4) 7%,transparent)}
.chip.pl-t{color:var(--c5);border-color:color-mix(in srgb,var(--c5) 28%,transparent);background:color-mix(in srgb,var(--c5) 7%,transparent)}

/* ============ HOME ============ */
.hero{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r2xl);
  padding:52px 48px 48px;box-shadow:var(--shadow-md);margin-top:44px
}
.hero h2{font-size:clamp(30px,4.6vw,42px);margin:14px 0 16px;letter-spacing:-.033em;
  line-height:1.14;font-weight:720;text-wrap:balance}
.hero p{margin:0;color:var(--ink-2);max-width:60ch;font-size:16px;line-height:1.7}

.stat{background:var(--card);border:1px solid var(--line);padding:22px 24px;
  border-radius:var(--r2xl);box-shadow:var(--shadow)}
.stat .n{font-family:var(--font-mono);font-size:28px;font-weight:600;line-height:1.1;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--ink-3);margin-top:6px;font-weight:500}
.bar{height:6px;background:var(--line-2);border-radius:999px;overflow:hidden;margin-top:14px}
.bar>i{display:block;height:100%;background:var(--carmine);border-radius:999px}

.route{display:flex;flex-direction:column;border:1px solid var(--line);
  background:var(--card);box-shadow:var(--shadow);border-radius:var(--r2xl);overflow:hidden}
.route .step{display:flex;gap:16px;padding:18px 24px;border-bottom:1px solid var(--line-2);align-items:flex-start}
.route .step:last-child{border-bottom:none}
.route .step:hover{background:var(--wash)}
.route .step .num{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);padding-top:4px;min-width:24px}
.route .step b{display:block;font-size:15px;font-weight:620;letter-spacing:-.012em}
.route .step small{color:var(--ink-3);font-size:13.5px;line-height:1.55}
.route .step button{margin-left:auto;flex:none}

/* ============ TABLES ============ */
table.tb{width:100%;border-collapse:collapse;font-size:14px}
table.tb th{
  text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);padding:14px 20px;border-bottom:1px solid var(--line);background:var(--wash)
}
table.tb td{padding:13px 20px;border-bottom:1px solid var(--line-2);vertical-align:top;line-height:1.6}
table.tb tr:last-child td{border-bottom:none}
table.tb tbody tr:hover td{background:var(--wash)}
table.tb td.k{font-size:15px;font-weight:640;width:1%;white-space:nowrap;letter-spacing:-.015em}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ============ VOCAB ============ */
.deckgrid button.deck{
  text-align:left;background:var(--card);border:1px solid var(--line);
  padding:22px;cursor:pointer;border-radius:var(--r2xl);box-shadow:var(--shadow);display:block;width:100%;
  transition:box-shadow .15s ease,transform .15s ease
}
.deckgrid button.deck:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.deckgrid .dt{font-weight:640;font-size:15.5px;letter-spacing:-.015em}
.deckgrid .dp{font-size:13.5px;color:var(--ink-3);margin-top:2px}
.deckgrid .dm{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);
  margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}

.flash{
  border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow-md);
  padding:72px 32px 56px;text-align:center;min-height:290px;display:flex;flex-direction:column;
  justify-content:center;gap:14px;cursor:pointer;position:relative;border-radius:var(--r2xl)
}
.flash .word{font-size:clamp(34px,6.5vw,52px);font-weight:660;line-height:1.15;letter-spacing:-.035em}
.flash .ko{font-size:20px;color:var(--ink-2);font-weight:550;letter-spacing:-.015em}
.flash .note{font-size:14px;color:var(--ink-3);max-width:46ch;margin:0 auto;line-height:1.6}
.flash .hint{position:absolute;bottom:20px;left:0;right:0;font-size:11.5px;font-weight:500;
  letter-spacing:.02em;color:var(--ink-3)}
.flash .tag{position:absolute;top:20px;left:22px}
.speak{position:absolute;top:16px;right:18px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--rmd);padding:6px 11px;cursor:pointer;font-size:13px;color:var(--ink-3)}
.speak:hover{color:var(--carmine);border-color:color-mix(in srgb,var(--carmine) 40%,transparent)}
.rowbtns{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.rowbtns .btn{flex:1;min-width:130px;padding:13px 18px}
.btn.know{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 26%,transparent);color:var(--good)}
.btn.dunno{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 26%,transparent);color:var(--bad)}

.wlist{width:100%;border-collapse:collapse;font-size:14.5px}
.wlist td{padding:13px 20px;border-bottom:1px solid var(--line-2)}
.wlist tr:last-child td{border-bottom:none}
.wlist tr:hover td{background:var(--wash)}
.wlist td.w{font-weight:620;font-size:16px;width:34%;letter-spacing:-.018em}
.wlist td.g{width:1%;white-space:nowrap}
.wlist td.s{width:1%;text-align:right}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);vertical-align:middle}
.dot.on{background:var(--good)}
.search{
  width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:var(--rmd);
  background:var(--card);box-shadow:var(--shadow-xs);font-size:14.5px
}
.search::placeholder{color:var(--ink-3)}
.search:focus{outline:none;border-color:color-mix(in srgb,var(--carmine) 45%,transparent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--carmine) 11%,transparent)}

/* ============ CASES ============ */
.casecard{
  position:relative;background:var(--card);border:1px solid var(--line);padding:22px;
  box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%;border-radius:var(--r2xl);
  transition:box-shadow .15s ease,transform .15s ease
}
.casecard:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.casecard .n{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);
  font-size:11px;color:var(--cc);letter-spacing:.07em;font-weight:600}
.casecard .n::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cc);flex:none}
.casecard .p{font-size:19px;font-weight:660;margin-top:10px;letter-spacing:-.024em}
.casecard .k{font-size:13.5px;color:var(--ink-2);margin-top:1px}
.casecard .q{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);margin-top:12px}

.casehead{margin:44px 0 24px}
.casehead h2{font-size:clamp(28px,4.4vw,38px);margin:10px 0 4px;color:var(--cc);
  letter-spacing:-.032em;font-weight:700;line-height:1.15}
.casehead .eyebrow{display:flex;align-items:center;gap:7px;color:var(--cc)}
.casehead .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cc);flex:none}

.ex{border-top:1px solid var(--line-2);padding:18px 0}
.ex:first-of-type{border-top:none;padding-top:0}
.ex:last-of-type{padding-bottom:0}
.ex .s{font-size:18px;line-height:1.55;font-weight:500;letter-spacing:-.018em}
.ex .s b{color:var(--cc);font-weight:680;
  box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--cc) 30%,transparent)}
.ex .t{font-size:13.5px;color:var(--ink-3);margin-top:5px}
.ex .spk{background:none;border:none;cursor:pointer;color:var(--ink-3);padding:0 4px;font-size:13px}
.ex .spk:hover{color:var(--cc)}

ul.use{margin:0;padding-left:20px;font-size:14.5px;line-height:1.75}
ul.use li{margin-bottom:10px}
ul.use li:last-child{margin-bottom:0}
ul.use code{font-family:var(--font-pl);font-weight:600;font-style:normal;letter-spacing:-.015em;
  background:var(--wash);padding:2px 7px;border-radius:var(--rxs);font-size:14px}
.preps{display:flex;flex-wrap:wrap;gap:8px}
.preps span{font-size:14px;font-weight:600;letter-spacing:-.015em;padding:6px 13px;
  border:1px solid color-mix(in srgb,var(--cc) 26%,transparent);
  background:color-mix(in srgb,var(--cc) 6%,transparent);
  color:var(--cc);border-radius:999px}
table.tb td.end{font-family:var(--font-mono);font-weight:600;color:var(--cc);font-size:13.5px}

/* ============ GRAMMAR ============ */
.lesson{scroll-margin-top:82px;border:1px solid var(--line);background:var(--card);
  box-shadow:var(--shadow);border-radius:var(--r2xl);overflow:hidden}
.lesson>button.lh{width:100%;text-align:left;background:none;border:none;padding:20px 24px;
  cursor:pointer;display:flex;gap:16px;align-items:center}
.lesson>button.lh:hover{background:var(--wash)}
.lesson .lnum{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);min-width:24px}
.lesson .lt{display:block;font-weight:620;font-size:15.5px;line-height:1.4;letter-spacing:-.015em}
.lesson .lp{display:block;font-size:13px;color:var(--ink-3);line-height:1.4}
.lesson .mark{margin-left:auto;font-size:12.5px;color:var(--good);font-weight:600}
.lbody{padding:4px 24px 28px;border-top:1px solid var(--line-2)}
.lbody h4{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);margin:32px 0 12px}
.lbody p{font-size:14.5px;margin:0 0 14px;line-height:1.75;color:var(--ink-2)}
.lbody p b{color:var(--ink)}
.lbody .scroll-x{border:1px solid var(--line);border-radius:var(--rlg);overflow:hidden;overflow-x:auto}

.drill{background:var(--wash);border:1px solid transparent;padding:20px;
  margin-top:12px;border-radius:var(--rlg)}
.drill .q{font-size:16.5px;margin-bottom:4px;font-weight:550;letter-spacing:-.018em}
.drill .ko{font-size:13px;color:var(--ink-3);margin-bottom:14px}
.drill input{padding:10px 14px;border:1px solid var(--line);border-radius:var(--rmd);

.qtype{

}

.qbar{display:flex;align-items:center;gap:14px;font-family:var(--font-mono);font-size:12px;

.qbar .track>i{display:block;height:100%;background:var(--carmine);border-radius:999px}
.qstem{font-size:14px;color:var(--ink-3);margin-bottom:10px;font-weight:500}

  box-shadow:var(--shadow-xs);transition:border-color .13s ease,box-shadow .13s ease

/* 과거형 6개에서 나머지 인칭을 규칙적으로 이끌어 낸다.
   mogłem→mogłeś, szedłem→szedłeś 처럼 어간이 불규칙해도 이 파생은 안전하다. */
const PERSONS=["ja (남)","ja (여)","ty (남)","ty (여)","on","ona",
               "my (남성인간)","my (그 외)","wy (남성인간)","wy (그 외)","oni","one"];
function pastAll(v){
  const [jaM,jaF,on,ona,oni,one]=v.past;
  return [jaM, jaF,
          jaM.replace(/em$/,"eś"), jaF.replace(/am$/,"aś"),
          on, ona,
          oni+"śmy", one+"śmy", oni+"ście", one+"ście",
          oni, one];
}
/* 조건법 = 과거형 + by + 인칭어미. 완전히 규칙적이다. */
function condAll(v){
  const [,,on,ona,oni,one]=v.past;
  return [on+"bym", ona+"bym", on+"byś", ona+"byś", on+"by", ona+"by",
          oni+"byśmy", one+"byśmy", oni+"byście", one+"byście", oni+"by", one+"by"];
}
/* 미래: 불완료상은 będę + 부정형, 완료상은 현재형이 곧 미래 */
const BEDE=["będę","będziesz","będzie","będziemy","będziecie","będą"];
function futAll(v){
  return v.asp==="perf" ? v.pres.slice() : BEDE.map(b=>b+" "+v.inf);
}

/* 형용사 어미는 완전히 규칙적이다 — 세 유형만 구분하면 표 전체가 만들어진다.

const ADJCOLS=["남성 (무생물)","남성 (생물)","여성","중성","복수 (남성인간)","복수 (그 외)"];
function declAdj(a){
  const st=a.base.replace(/(y|i)$/,"");            /* 어간 */
  const hard=a.type==="h";
  const I=hard?"":"i";                             /* k·g와 연자음은 -i- 계열 */
  const mN=a.base;
  const gen=st+I+"ego", dat=st+I+"emu", ins=st+I+(hard?"ym":"m"), loc=ins;
  const fN=st+(a.type==="s"?"ia":"a"), fG=st+I+"ej", fA=st+(a.type==="s"?"ią":"ą");
  const nN=st+I+"e";
  const plG=st+I+(hard?"ych":"ch"), plD=st+I+(hard?"ym":"m"), plI=st+I+(hard?"ymi":"mi");
  return {
    /* 남성 무생물 */ mi:[mN,gen,dat,mN,ins,loc],
    /* 남성 생물   */ ma:[mN,gen,dat,gen,ins,loc],
    /* 여성        */ f :[fN,fG,fG,fA,fA,fG],
    /* 중성        */ n :[nN,gen,dat,nN,ins,loc],
    /* 복수 남성인간*/ pp:[a.mpl,plG,plD,plG,plI,plG],
    /* 복수 그 외  */ po:[nN,plG,plD,nN,plI,plG]
  };
}

/* 표제어 → 문장 색인. 단어·동사·형용사 화면이 이걸로 예문을 끌어온다. */
const SENT_BY_LEM={};
SENTENCES.forEach(s=>s.lem.forEach(l=>{(SENT_BY_LEM[l]=SENT_BY_LEM[l]||[]).push(s);}));
const SENT_BY_CASE={};
SENTENCES.forEach(s=>s.marks.forEach(m=>{(SENT_BY_CASE[m.c]=SENT_BY_CASE[m.c]||[]).push({s,w:m.w});}));
const sentFor=(lemma,n)=>(SENT_BY_LEM[lemma]||[]).filter(s=>lvOK(s.lv)).slice(0,n||3);

/* ---- 격·어미 예문 생성 ----
   손으로 쓴 예문만으로는 단어 1,800개를 덮을 수 없다. 그래서 이미 검증해 둔
   격변화표·활용표·형용사표에서 문장을 만들어 채운다. 지어내는 게 아니라
   확인된 형태를 뼈대 문장에 끼워 넣는 것이라 문법적으로 안전하다. */
const CASE_FRAME=[
  null,
  {pl:f=>`To jest ${f}.`,        ko:"이것은 ~이다"},
  {pl:f=>`Nie ma ${f}.`,         ko:"~가 없다"},
  {pl:(f,per)=>per?`Daję to ${f}.`:`Dzięki ${f}.`, ko:(per)=>per?"~에게 준다":"~ 덕분에"},
  {pl:f=>`Widzę ${f}.`,          ko:"~를 본다"},
  {pl:(f,per)=>per?`Rozmawiam z ${f}.`:`Stoję przed ${f}.`, ko:(per)=>per?"~와 이야기한다":"~ 앞에 서 있다"},
  {pl:f=>`Myślę o ${f}.`,        ko:"~에 대해 생각한다"},
  {pl:f=>`${f}!`,                ko:"~야! (부름)"}
];
function genCaseSents(word){
  const d=DECLMAP[word]; if(!d)return [];
  const per=isPerson(d), out=[];
  for(let ci=1;ci<=7;ci++){
    if(ci===7&&(!per||d.auto))continue;
    const f=d.sg[ci-1];
    if(ci!==1&&f===d.sg[0])continue;         /* 주격과 같으면 배울 게 없다 */
    const fr=CASE_FRAME[ci];
    out.push({pl:fr.pl(f,per), ko:(typeof fr.ko==="function"?fr.ko(per):fr.ko),
              tag:CASES[ci-1].ko, cc:ci, marks:[{c:ci,w:f}], gen:true});
  }
  return out;
}
function genVerbSents(word){
  const v=VERBMAP[word]; if(!v)return [];
  const M=(f,c)=>[{c:c||5,w:f}];
  const out=[{pl:`Ja ${v.pres[0]}.`, ko:`${v.ko} — 현재, 나`, tag:"현재", cc:5, marks:M(v.pres[0]), gen:true},
             {pl:`Ona ${v.pres[2]}.`, ko:`${v.ko} — 현재, 그녀`, tag:"현재", cc:5, marks:M(v.pres[2]), gen:true},
             {pl:`Wczoraj ${v.past[0]}.`, ko:`${v.ko} — 과거, 나(남성)`, tag:"과거", cc:5, marks:M(v.past[0]), gen:true},
             {pl:`Wczoraj ${v.past[1]}.`, ko:`${v.ko} — 과거, 나(여성)`, tag:"과거", cc:5, marks:M(v.past[1]), gen:true}];
  const f=futAll(v)[0];
  out.push({pl:`Jutro ${f}.`, ko:`${v.ko} — 미래`, tag:"미래", cc:5, marks:M(f), gen:true});
  if(v.imper[0]!=="—"){
    const im=v.imper[0].charAt(0).toUpperCase()+v.imper[0].slice(1);
    out.push({pl:`${im}!`, ko:`${v.ko} — 명령`, tag:"명령", cc:5, marks:M(im), gen:true});

}
function genAdjSents(word){
  const a=ADJMAP[word]; if(!a)return [];
  const t=declAdj(a);

  const out=[{pl:`To jest ${t.mi[0]} dom.`, ko:`${a.ko} — 남성`, tag:"남성", cc:1, marks:A(t.mi[0],1), gen:true},

/* 단어 하나에 대해 예문 최대 n개 — 손으로 쓴 것 먼저, 모자라면 생성분으로 */
function examplesFor(word,n){
  n=n||5;
  const real=(SENT_BY_LEM[word]||[]).filter(x=>lvOK(x.lv))
    .map(x=>({pl:x.pl,ko:x.ko,lv:x.lv,marks:x.marks,gen:false}));
  const made=genCaseSents(word).concat(genVerbSents(word),genAdjSents(word));
  const seen=new Set(), out=[];
  for(const e of real.concat(made)){
    if(out.length>=n)break;
    if(seen.has(e.pl))continue;
    seen.add(e.pl); out.push(e);
  }
  return out;
}
const sentForCase=(ci,n)=>(SENT_BY_CASE[ci]||[]).filter(x=>lvOK(x.s.lv)).slice(0,n||6);
/* 문장 안의 한 형태를 굵게 */
function markUp(pl,w){
  if(!w)return esc(pl);
  const i=pl.indexOf(w);
  if(i<0)return esc(pl);
  return esc(pl.slice(0,i))+"<b>"+esc(w)+"</b>"+esc(pl.slice(i+w.length));
}
/* 한 문장에 여러 격이 들어 있으면 각각 자기 색으로 강조한다 */
function markUpCases(pl,marks){
  if(!marks||!marks.length)return esc(pl);
  const spans=[];
  marks.forEach(m=>{const i=pl.indexOf(m.w); if(i>=0)spans.push({i,len:m.w.length,c:m.c});});
  spans.sort((a,b)=>a.i-b.i);
  let out="",pos=0;
  spans.forEach(sp=>{
    if(sp.i<pos)return;                      /* 겹치면 건너뛴다 */
    out+=esc(pl.slice(0,0))+esc(pl.slice(pos,sp.i));
    out+=`<b style="color:var(--c${sp.c});box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--c${sp.c}) 32%,transparent)">`
       +esc(pl.slice(sp.i,sp.i+sp.len))+"</b>";
    pos=sp.i+sp.len;
  });
  return out+esc(pl.slice(pos));
}
/* 문장에 쓰인 격을 칩으로 — 같은 격이 두 번 나오면 한 번만 */
function caseChips(marks){
  if(!marks||!marks.length)return "";
  const seen=[];
  marks.forEach(m=>{if(!seen.includes(m.c))seen.push(m.c);});
  return seen.map(c=>`<span class="chip" style="margin-left:5px;color:var(--c${c});
    border-color:color-mix(in srgb,var(--c${c}) 40%,transparent);
    background:color-mix(in srgb,var(--c${c}) 8%,transparent)">${CASES[c-1].ko}</span>`).join("");
}
/* 예문 블록 — 어디서든 같은 모양으로 쓴다 */
function sentBlock(list,cc){
  if(!list.length)return "";
  return `<div class="card pad" style="${cc?`--cc:var(--c${cc})`:"--cc:var(--c5)"}">
    <div class="eyebrow" style="margin-bottom:10px">예문</div>
    ${list.map(x=>{const s=x.s||x;
      /* 격 화면에서는 그 격만, 그 밖에서는 문장의 모든 격을 표시한다 */
      const marks = x.w ? [{c:cc||5, w:x.w}] : (s.marks||[]);
      return `<div class="ex"><div class="s">${markUpCases(s.pl,marks)}
        <button class="spk" data-say="${esc(s.pl)}">🔊</button></div>
        <div class="t">${esc(s.ko)} <span class="chip" style="margin-left:6px">${s.lv}</span>${
          x.w?"":caseChips(marks)}</div></div>`;}).join("")}
  </div>`;
}

   <h4>iść vs jechać</h4>
   <p><span class="pl"><b>iść</b></span> = 걸어서 간다. <span class="pl"><b>jechać</b></span> = 탈것으로 간다. 한국어는 둘 다 '가다'라 헷갈리기 쉬운 지점입니다.<br>
   <span class="pl">Idę do sklepu.</span> 가게에 (걸어서) 간다. · <span class="pl">Jadę do Krakowa.</span> 크라쿠프에 (기차·차로) 간다.</p>`,
   drills:[["Ja ___ (iść) do sklepu.","idę","나는 가게에 간다."],
           ["Czy ty ___ (chcieć) kawę?","chcesz","커피 마실래?"],
           ["Nie ___ (móc, ja) przyjść.","mogę","나는 올 수 없다."],
           ["Oni ___ (jeść) obiad.","jedzą","그들은 점심을 먹는다."],
           ["My ___ (jechać) do Polski.","jedziemy","우리는 폴란드로 간다."]]},

  {id:"neg",lv:"A2",t:"부정문 — nie + 속격의 함정",p:"Przeczenie",
   html:`<p>부정은 동사 앞에 <code>nie</code>만 붙이면 됩니다. 그런데 <b>목적어가 있으면 격이 바뀝니다.</b> 한국인 학습자가 가장 자주 틀리는 지점이에요.</p>

   <h4>이중 부정은 정상이다</h4>
   <p>영어와 달리 폴란드어는 부정을 겹쳐 씁니다.<br>
   <span class="pl">Nigdy <b>nie</b> piję kawy.</span> 나는 커피를 절대 안 마신다.<br>
   <span class="pl"><b>Nic</b> <b>nie</b> rozumiem.</span> 아무것도 이해 못 하겠다.</p>
   <h4>있다 / 없다</h4>
   <p><span class="pl">Jest chleb.</span> 빵이 있다. → <span class="pl"><b>Nie ma chleba.</b></span> 빵이 없다. (<code>nie ma</code>는 인칭 변화 없이 고정)</p>`,
   drills:[["Nie mam ___ (czas).","czasu","나는 시간이 없다."],

  {id:"past",lv:"A2",t:"과거시제 — 성별이 드러난다",p:"Czas przeszły",

   <tr><td class="k">ja</td><td class="mono">-łem</td><td class="mono">-łam</td><td class="pl">byłem / byłam</td></tr>
   <tr><td class="k">ty</td><td class="mono">-łeś</td><td class="mono">-łaś</td><td class="pl">byłeś / byłaś</td></tr>
   <tr><td class="k">on / ona</td><td class="mono">-ł</td><td class="mono">-ła</td><td class="pl">był / była</td></tr>

   <p><b>주의</b>: <span class="pl">mieć</span>는 <span class="pl">miałem/miałam</span>, <span class="pl">jeść</span>는 <span class="pl">jadłem/jadłam</span>, <span class="pl">iść</span>는 <span class="pl">szedłem/szłam</span>으로 어간이 바뀝니다.</p>`,
   drills:[["Wczoraj ___ (być, 남·나) w kinie.","byłem","어제 나는 영화관에 있었다."],

           ["Oni ___ (pracować) w Polsce.","pracowali","그들은 폴란드에서 일했다."],

   html:`<p>불완료상 동사의 미래는 <code>być</code>의 미래형에 부정사를 붙이면 끝입니다. A1 단계에서는 이 형태만 알아도 충분합니다.</p>

   html:`<p>미래를 말하는 방법이 <b>두 가지</b>입니다. 어느 쪽을 쓰느냐가 뜻을 바꿉니다.</p>

   <b>Jutro napiszę</b> raport. 내일 보고서를 (다) 쓸 것이다.</p>
   <h4>będę 뒤에는 두 가지가 온다</h4>
   <p><span class="pl">będę czytać</span>(부정형)와 <span class="pl">będę czytał / czytała</span>(과거분사형) 둘 다 맞고 뜻도 같습니다. 초급에서는 부정형이 쉽고, 원어민은 분사형을 더 자주 씁니다.</p>`,
   drills:[["Jutro ___ (napisać) list.","napiszę","내일 편지를 다 쓸 것이다."],
           ["Cały wieczór ___ (być) oglądać film.","będę","저녁 내내 영화를 보고 있을 것이다."],
           ["Ona ___ (kupić) nowy samochód.","kupi","그녀는 새 차를 살 것이다 — 완료상"]]},

  {id:"imper",lv:"B1",t:"명령법 — 부탁과 지시",p:"Tryb rozkazujący",
   html:`<p>명령형은 <b>3인칭 단수 현재</b>에서 어미를 떼어 만듭니다. <span class="pl">robi → rób</span>, <span class="pl">pisze → pisz</span>, <span class="pl">czyta → czytaj</span>.</p>
   <div class="scroll-x"><table class="tb"><thead><tr><th>인칭</th><th>robić</th><th>zrobić</th><th>iść</th><th>być</th></tr></thead><tbody>
   <tr><td class="k">ty</td><td class="pl">rób</td><td class="pl">zrób</td><td class="pl">idź</td><td class="pl">bądź</td></tr>
   <tr><td class="k">my</td><td class="pl">róbmy</td><td class="pl">zróbmy</td><td class="pl">idźmy</td><td class="pl">bądźmy</td></tr>
   <tr><td class="k">wy</td><td class="pl">róbcie</td><td class="pl">zróbcie</td><td class="pl">idźcie</td><td class="pl">bądźcie</td></tr>
   </tbody></table></div>
   <h4>상에 따라 뜻이 갈린다</h4>
   <p><span class="pl"><b>Zrób</b> to!</span> 그거 (당장) 해! — 완료상, 한 번의 요구<br>
   <span class="pl"><b>Rób</b> to!</span> 계속 그렇게 해! — 불완료상, 과정<br>
   <b>부정 명령은 거의 항상 불완료상</b>입니다: <span class="pl">Nie <b>rób</b> tego!</span> 그거 하지 마!</p>
   <h4>공손하게 말하려면</h4>
   <p>명령형은 직설적이라 낯선 사람에게는 잘 안 씁니다. 대신:<br>
   <span class="pl"><b>Proszę</b> usiąść.</span> 앉으세요. (proszę + 부정형 — 가장 안전)<br>
   <span class="pl">Czy <b>mógłby</b> pan…?</span> ~해 주실 수 있을까요? (조건법)</p>`,
   drills:[["___ (zrobić, ty) to teraz!","Zrób","지금 그거 해!"],
           ["Nie ___ (otwierać, ty) drzwi!","otwieraj","문 열지 마! — 부정 명령은 불완료상"],
           ["___ (być, ty) cierpliwy!","Bądź","인내심을 가져!"],
           ["___ (iść, my) do kina!","Idźmy","영화관에 가자!"]]},

  {id:"cond",lv:"B1",t:"조건법 — chciałbym, gdyby",p:"Tryb przypuszczający",
   html:`<p>조건법은 <b>과거형 + by + 인칭어미</b>로 만듭니다. 예외가 없어서 과거형만 알면 바로 만들어집니다.</p>
   <div class="scroll-x"><table class="tb"><thead><tr><th>인칭</th><th>남성</th><th>여성</th></tr></thead><tbody>
   <tr><td class="k">ja</td><td class="pl">robiłbym</td><td class="pl">robiłabym</td></tr>
   <tr><td class="k">ty</td><td class="pl">robiłbyś</td><td class="pl">robiłabyś</td></tr>
   <tr><td class="k">on / ona</td><td class="pl">robiłby</td><td class="pl">robiłaby</td></tr>
   <tr><td class="k">my</td><td class="pl">robilibyśmy</td><td class="pl">robiłybyśmy</td></tr>
   <tr><td class="k">wy</td><td class="pl">robilibyście</td><td class="pl">robiłybyście</td></tr>
   <tr><td class="k">oni / one</td><td class="pl">robiliby</td><td class="pl">robiłyby</td></tr>
   </tbody></table></div>
   <h4>제일 많이 쓰는 자리 — 공손함</h4>
   <p class="pl" style="font-size:17px"><b>Chciałbym</b> kawę. 커피 주시겠어요? (남성 화자)<br>
   <b>Chciałabym</b> zarezerwować stolik. 테이블을 예약하고 싶은데요. (여성 화자)<br>
   Czy <b>mógłbyś</b> mi pomóc? 나 좀 도와줄 수 있어?</p>
   <h4>gdyby — 만약 ~라면</h4>
   <p>가정 조건절에는 <span class="pl">gdyby</span>를 쓰고, <b>두 절 모두 조건법</b>입니다.<br>
   <span class="pl"><b>Gdybym</b> miał czas, <b>poszedłbym</b> na spacer.</span> 시간이 있다면 산책을 갈 텐데.<br>
   실현 가능한 조건에는 <span class="pl">jeśli</span> + 직설법: <span class="pl">Jeśli będę miał czas, pójdę.</span></p>`,
   drills:[["___ (chcieć, ja-남) prosić o rachunek.","Chciałbym","계산서를 부탁드리고 싶습니다."],
           ["Czy ___ (móc, ty) mi pomóc?","mógłbyś","나 좀 도와줄 수 있어?"],
           ["___ (mieć, ja-남) czas, poszedłbym.","Gdybym","시간이 있다면 갈 텐데. — gdyby + 조건법"],
           ["Ona ___ (kupić) ten dom.","kupiłaby","그녀라면 그 집을 살 텐데."]]},

  {id:"motion",lv:"B1",t:"이동동사 — iść / chodzić / pójść",p:"Czasowniki ruchu",
   html:`<p>폴란드어 이동동사는 <b>세 갈래</b>입니다. 한국어는 다 '가다'라서 가장 헷갈리는 지점이에요.</p>
   <div class="scroll-x"><table class="tb"><thead><tr>
     <th></th><th>방향형 (한 번, 한 방향)</th><th>반복형 (습관, 왕복)</th><th>완료형 (출발)</th></tr></thead><tbody>
   ${MOTION.map(m=>`<tr><td class="k">${m[3]}</td>
     <td class="pl" style="font-weight:600;color:var(--c1)">${m[0]}</td>
     <td class="pl" style="font-weight:600;color:var(--c4)">${m[1]}</td>
     <td class="pl" style="font-weight:600;color:var(--c2)">${m[2]}</td></tr>`).join("")}
   </tbody></table></div>
   <p class="pl" style="font-size:17px"><b>Idę</b> do sklepu. 지금 가게에 가는 중이다.<br>
   <b>Chodzę</b> do szkoły. 나는 학교에 다닌다. (습관)<br>
   <b>Poszedłem</b> do sklepu. 가게에 갔다. (그리고 갔다 왔거나, 갔다)</p>
   <h4>접두사가 방향을 바꾼다</h4>
   <div class="scroll-x"><table class="tb"><thead><tr><th>동사</th><th>뜻</th><th>접두사</th></tr></thead><tbody>
   ${PREFIXED.map(p=>`<tr><td class="k pl">${p[0]}</td><td>${p[1]}</td>
     <td style="color:var(--ink-3)">${p[2]}</td></tr>`).join("")}
   </tbody></table></div>
   <p>같은 접두사가 <span class="pl">jechać</span>에도 붙습니다: <span class="pl">wjechać, wyjechać, przyjechać, odjechać</span>. 걸어서면 <span class="pl">-jść</span>, 타고면 <span class="pl">-jechać</span>.</p>`,
   drills:[["Codziennie ___ (chodzić) do pracy.","chodzę","나는 매일 직장에 다닌다 — 습관"],
           ["Teraz ___ (iść) do sklepu.","idę","지금 가게에 가는 중이다 — 한 방향"],
           ["Wczoraj ___ (pójść, 남) do kina.","poszedłem","어제 영화관에 갔다 — 완료"],
           ["Pociąg ___ (przyjechać) o piątej.","przyjedzie","기차는 5시에 도착할 것이다."]]},

  {id:"comp",lv:"B1",t:"비교급과 최상급",p:"Stopniowanie",
   html:`<p>형용사에 <span class="pl">-szy</span> 또는 <span class="pl">-ejszy</span>를 붙이고, 최상급은 거기에 <span class="pl">naj-</span>를 앞에 붙입니다.</p>
   <div class="scroll-x"><table class="tb"><thead><tr><th>원급</th><th>비교급</th><th>최상급</th></tr></thead><tbody>
   ${["ładny","szybki","trudny","stary","długi"].map(b=>{const a=ADJMAP[b];
     return `<tr><td class="k pl">${a.base}</td><td class="pl" style="color:var(--c3);font-weight:600">${a.comp}</td>
     <td class="pl" style="color:var(--c2);font-weight:600">${a.sup}</td></tr>`;}).join("")}
   </tbody></table></div>
   <h4>불규칙 — 자주 쓰는 것들</h4>
   <div class="scroll-x"><table class="tb"><thead><tr><th>원급</th><th>비교급</th><th>최상급</th></tr></thead><tbody>
   ${["dobry","zły","duży","mały"].map(b=>{const a=ADJMAP[b];
     return `<tr><td class="k pl">${a.base}</td><td class="pl" style="color:var(--c3);font-weight:600">${a.comp}</td>
     <td class="pl" style="color:var(--c2);font-weight:600">${a.sup}</td></tr>`;}).join("")}
   </tbody></table></div>
   <h4>bardziej — 어미로 안 될 때</h4>
   <p>길거나 분사에서 온 형용사는 <span class="pl">bardziej</span>(더) · <span class="pl">najbardziej</span>(가장)를 앞에 붙입니다:
   <span class="pl">bardziej zmęczony, najbardziej znany</span>. 반대는 <span class="pl">mniej</span>(덜).</p>
   <h4>비교 문장 만들기</h4>
   <p class="pl" style="font-size:17px">Ania jest <b>wyższa niż</b> Marek. / Ania jest <b>wyższa od</b> Marka. 아니아는 마렉보다 크다.<br>
   Ten dom jest <b>taki sam jak</b> tamten. 이 집은 저 집과 같다.</p>
   <p><span class="pl">niż</span> 뒤에는 <b>주격</b>, <span class="pl">od</span> 뒤에는 <b>속격</b>이 옵니다.</p>
   <h4>부사도 비교한다</h4>
   <p class="pl" style="font-size:17px">dobrze → <b>lepiej</b> → <b>najlepiej</b> · źle → <b>gorzej</b> → <b>najgorzej</b> · szybko → <b>szybciej</b> → <b>najszybciej</b></p>`,
   drills:[["Ania jest ___ (wysoki, 여성 비교급) niż Marek.","wyższa","아니아는 마렉보다 키가 크다."],
           ["To jest ___ (dobry, 최상급) restauracja w mieście.","najlepsza","시내 최고의 식당이다. — 여성"],
           ["Mówię po polsku ___ (dobrze, 비교급) niż rok temu.","lepiej","작년보다 폴란드어를 더 잘한다."],
           ["Ten samochód jest ___ (drogi, 비교급).","droższy","이 차가 더 비싸다."]]},

  {id:"ktory",lv:"B1",t:"관계대명사 który",p:"Zaimek względny „który”",
   html:`<p><span class="pl">który</span>는 영어 who/which에 해당하지만, <b>형용사처럼 변합니다</b>. 규칙은 두 가지예요.</p>
   <div class="card pad" style="background:var(--wash);border:none;margin:12px 0">
     <b>성과 수</b>는 <u>앞에 오는 명사</u>를 따르고, <b>격</b>은 <u>자기가 들어간 절 안에서의 역할</u>을 따른다.</div>
   <p class="pl" style="font-size:17px">To jest mężczyzna, <b>który</b> mieszka obok. 옆집에 사는 남자다. <span style="font-size:13px;color:var(--ink-3)">(남성 + 관계절의 주어 → 주격)</span><br>
   To jest mężczyzna, <b>którego</b> znam. 내가 아는 남자다. <span style="font-size:13px;color:var(--ink-3)">(남성 + znam의 목적어 → 대격=속격형)</span><br>
   To jest książka, <b>którą</b> czytam. 내가 읽는 책이다. <span style="font-size:13px;color:var(--ink-3)">(여성 + 목적어 → 대격 -ą)</span><br>
   To jest dom, w <b>którym</b> mieszkam. 내가 사는 집이다. <span style="font-size:13px;color:var(--ink-3)">(남성 + w 뒤 → 전치격)</span></p>
   <h4>변화표</h4>
   <div class="scroll-x"><table class="tb"><thead><tr><th>격</th><th>남성</th><th>여성</th><th>중성</th><th>복수 (그 외)</th></tr></thead><tbody>
   ${(()=>{const t=declAdj({base:"który",type:"h",mpl:"którzy"});
     return CASES.slice(0,6).map((c,i)=>`<tr><td class="k" style="font-family:var(--font-ui);font-size:12.5px;color:var(--c${c.id})">${c.ko}</td>
     <td class="pl">${t.mi[i]}</td><td class="pl">${t.f[i]}</td><td class="pl">${t.n[i]}</td><td class="pl">${t.po[i]}</td></tr>`).join("");})()}
   </tbody></table></div>
   <p>관계절 앞에는 <b>반드시 쉼표</b>를 찍습니다. 폴란드어는 영어와 달리 이 쉼표를 생략할 수 없어요.</p>`,
   drills:[["To jest kobieta, ___ mieszka obok.","która","옆집에 사는 여자다 — 여성 주격"],
           ["To jest film, ___ oglądałem.","który","내가 본 영화다 — 남성 무생물 대격 = 주격"],
           ["To jest dom, w ___ mieszkam.","którym","내가 사는 집이다 — 전치격"],
           ["To jest książka, ___ czytam.","którą","내가 읽는 책이다 — 여성 대격"]]},

  {id:"imperso",lv:"B1",t:"무인칭 표현 — trzeba, można, warto",p:"Formy bezosobowe",
   html:`<p>주어 없이 "~해야 한다 / ~할 수 있다"를 말하는 표현입니다. 뒤에는 항상 <b>부정형</b>이 옵니다.</p>
   <div class="scroll-x"><table class="tb"><thead><tr><th>표현</th><th>뜻</th><th>예</th></tr></thead><tbody>
   <tr><td class="k pl">trzeba</td><td>~해야 한다</td><td class="pl">Trzeba iść. 가야 한다.</td></tr>
   <tr><td class="k pl">można</td><td>~해도 된다, ~할 수 있다</td><td class="pl">Czy można wejść? 들어가도 될까요?</td></tr>
   <tr><td class="k pl">warto</td><td>~할 만하다</td><td class="pl">Warto zobaczyć. 볼 만하다.</td></tr>
   <tr><td class="k pl">należy</td><td>~해야 한다 (격식)</td><td class="pl">Należy zapłacić. 지불해야 합니다.</td></tr>
   <tr><td class="k pl">nie wolno</td><td>~하면 안 된다 (금지)</td><td class="pl">Nie wolno palić. 흡연 금지.</td></tr>
   <tr><td class="k pl">wystarczy</td><td>~하면 충분하다</td><td class="pl">Wystarczy zadzwonić. 전화만 하면 돼요.</td></tr>
   </tbody></table></div>
   <h4>과거와 미래도 된다</h4>
   <p><span class="pl">trzeba <b>było</b> iść</span> 갔어야 했다 · <span class="pl">będzie trzeba iść</span> 가야 할 것이다<br>
   <span class="pl">można <b>było</b></span> ~할 수 있었다</p>
   <h4>musieć와의 차이</h4>
   <p><span class="pl">Muszę iść.</span> (내가) 가야 한다 — 주어가 있다.<br>
   <span class="pl">Trzeba iść.</span> (누구든) 가야 한다 — 주어가 없다. 일반적인 당위.</p>`,
   drills:[["___ iść do lekarza.","Trzeba","의사에게 가야 한다."],
           ["Czy ___ tu palić?","można","여기서 담배 피워도 되나요?"],
           ["Nie ___ tu parkować.","wolno","여기 주차 금지."],
           ["___ było zadzwonić wcześniej.","Trzeba","더 일찍 전화했어야 했다."]]},

  {id:"rekcja",lv:"B1",t:"동사의 격 지배",p:"Rekcja czasownika",
   html:`<p>동사마다 <b>정해진 격</b>을 요구합니다. 뜻으로 유추되지 않으니 동사를 외울 때 격까지 함께 외워야 합니다.</p>
   <div class="scroll-x"><table class="tb"><thead><tr><th>격</th><th>동사</th><th>예</th></tr></thead><tbody>
   <tr><td class="k" style="color:var(--c2)">속격</td>
     <td class="pl">szukać, słuchać, uczyć się, potrzebować, bać się, żałować, używać</td>
     <td class="pl">Słucham <b>muzyki</b>.</td></tr>
   <tr><td class="k" style="color:var(--c3)">여격</td>
     <td class="pl">pomagać, dziękować, ufać, przeszkadzać, podobać się, wierzyć</td>
     <td class="pl">Pomagam <b>mamie</b>.</td></tr>
   <tr><td class="k" style="color:var(--c4)">대격</td>
     <td class="pl">mieć, lubić, znać, widzieć, kupować, czytać, kochać</td>
     <td class="pl">Lubię <b>kawę</b>.</td></tr>
   <tr><td class="k" style="color:var(--c5)">조격</td>
     <td class="pl">być, zostać, interesować się, zajmować się, opiekować się, cieszyć się</td>
     <td class="pl">Interesuję się <b>muzyką</b>.</td></tr>
   </tbody></table></div>
   <h4>한국어와 어긋나는 것들</h4>
   <p>한국어로는 '~를'인데 폴란드어는 속격·여격을 쓰는 경우가 함정입니다.<br>
   <span class="pl">Słucham <b>muzyki</b>.</span> 음악<u>을</u> 듣는다 — 속격<br>
   <span class="pl">Pomagam <b>bratu</b>.</span> 형<u>을</u> 돕는다 — 여격<br>
   <span class="pl">Szukam <b>pracy</b>.</span> 일<u>을</u> 찾는다 — 속격<br>
   <span class="pl">Używam <b>komputera</b>.</span> 컴퓨터<u>를</u> 쓴다 — 속격</p>`,
   drills:[["Słucham ___ (muzyka).","muzyki","음악을 듣는다 — 속격"],
           ["Pomagam ___ (brat).","bratu","형을 돕는다 — 여격"],
           ["Interesuję się ___ (historia).","historią","역사에 관심이 있다 — 조격"],
           ["Szukam ___ (praca).","pracy","일자리를 찾는다 — 속격"]]},

  {id:"advb",lv:"B1",t:"부사 만들기",p:"Przysłówki",
   html:`<p>형용사에서 부사를 만드는 규칙은 간단합니다. 어미를 <span class="pl">-o</span> 또는 <span class="pl">-ie</span>로 바꿉니다.</p>
   <div class="scroll-x"><table class="tb"><thead><tr><th>형용사</th><th>부사</th><th>비교급</th></tr></thead><tbody>
   <tr><td class="k pl">dobry</td><td class="pl" style="font-weight:600">dobrze</td><td class="pl">lepiej</td></tr>
   <tr><td class="k pl">zły</td><td class="pl" style="font-weight:600">źle</td><td class="pl">gorzej</td></tr>
   <tr><td class="k pl">szybki</td><td class="pl" style="font-weight:600">szybko</td><td class="pl">szybciej</td></tr>
   <tr><td class="k pl">wolny</td><td class="pl" style="font-weight:600">wolno</td><td class="pl">wolniej</td></tr>
   <tr><td class="k pl">ładny</td><td class="pl" style="font-weight:600">ładnie</td><td class="pl">ładniej</td></tr>
   <tr><td class="k pl">trudny</td><td class="pl" style="font-weight:600">trudno</td><td class="pl">trudniej</td></tr>
   <tr><td class="k pl">miły</td><td class="pl" style="font-weight:600">miło</td><td class="pl">milej</td></tr>
   <tr><td class="k pl">cichy</td><td class="pl" style="font-weight:600">cicho</td><td class="pl">ciszej</td></tr>
   </tbody></table></div>
   <p><b>형용사와 부사를 헷갈리지 마세요</b> — 형용사는 명사를, 부사는 동사를 꾸밉니다.<br>
   <span class="pl">To jest <b>dobry</b> student.</span> 좋은 학생이다. (형용사)<br>
   <span class="pl">On mówi <b>dobrze</b>.</span> 그는 말을 잘한다. (부사)</p>
   <h4>상태를 말하는 무인칭 부사</h4>
   <p><span class="pl">Jest <b>zimno</b>.</span> 춥다. · <span class="pl">Jest <b>miło</b>.</span> 기분 좋다. · <span class="pl"><b>Smutno</b> mi.</span> 나는 슬프다. (여격 + 부사)</p>`,
   drills:[["On mówi po polsku ___ (dobry → 부사).","dobrze","그는 폴란드어를 잘한다."],
           ["Idź ___ (szybki → 부사)!","szybko","빨리 가!"],
           ["Dzisiaj jest ___ (zimny → 부사).","zimno","오늘은 춥다."]]},

  {id:"collect",lv:"B1",t:"남성인간 수사와 집합수사",p:"Liczebniki męskoosobowe i zbiorowe",
   html:`<p>사람(남성 포함)을 셀 때는 <b>수사 자체가 달라집니다</b>. A2까지는 피해 갈 수 있지만 B1에서는 반드시 만납니다.</p>
   <div class="scroll-x"><table class="tb"><thead><tr>
     <th>수</th><th>일반</th><th>남성인간</th><th>집합수사</th></tr></thead><tbody>
   <tr><td class="k mono">2</td><td class="pl">dwa / dwie</td><td class="pl" style="color:var(--c5);font-weight:600">dwaj / dwóch</td><td class="pl" style="color:var(--c4);font-weight:600">dwoje</td></tr>
   <tr><td class="k mono">3</td><td class="pl">trzy</td><td class="pl" style="color:var(--c5);font-weight:600">trzej / trzech</td><td class="pl" style="color:var(--c4);font-weight:600">troje</td></tr>
   <tr><td class="k mono">4</td><td class="pl">cztery</td><td class="pl" style="color:var(--c5);font-weight:600">czterej / czterech</td><td class="pl" style="color:var(--c4);font-weight:600">czworo</td></tr>
   <tr><td class="k mono">5</td><td class="pl">pięć</td><td class="pl" style="color:var(--c5);font-weight:600">pięciu</td><td class="pl" style="color:var(--c4);font-weight:600">pięcioro</td></tr>
   </tbody></table></div>
   <p class="pl" style="font-size:17px"><b>Dwaj studenci</b> czytają. / <b>Dwóch studentów</b> czyta. 학생 두 명이 읽는다.<br>
   <b>Dwoje dzieci</b> bawi się. 아이 둘이 논다.</p>
   <h4>집합수사는 언제 쓰나</h4>
   <p>① 남녀가 섞인 집단: <span class="pl">troje przyjaciół</span> ② 아이·새끼: <span class="pl">dwoje dzieci</span>
   ③ 항상 복수인 명사: <span class="pl">dwoje drzwi</span> 문 두 개, <span class="pl">troje oczu</span></p>
   <p><b>동사도 바뀝니다</b> — <span class="pl">dwóch studentów <b>czyta</b></span>처럼 속격형을 쓰면 동사는 <b>3인칭 단수</b>가 됩니다.</p>`,
   drills:[["___ (2, 남성인간) studentów czyta.","Dwóch","학생 두 명이 읽는다."],
           ["___ (3, 집합) dzieci bawi się.","Troje","아이 셋이 논다."],
           ["W pokoju jest ___ (5, 남성인간) mężczyzn.","pięciu","방에 남자 다섯 명이 있다."]]},

  {id:"zeby",lv:"B1",t:"że · żeby · bo — 절 잇기",p:"Zdania złożone",
   html:`<p>B1에서는 문장을 길게 이어야 합니다. 접속사 세 개만 확실히 하면 대부분 해결됩니다.</p>
   <div class="scroll-x"><table class="tb"><thead><tr><th>접속사</th><th>뜻</th><th>뒤에 오는 것</th><th>예</th></tr></thead><tbody>
   <tr><td class="k pl">że</td><td>~라는 것</td><td>직설법</td><td class="pl">Myślę, <b>że</b> masz rację.</td></tr>
   <tr><td class="k pl">żeby</td><td>~하기 위해; ~하도록</td><td>부정형 또는 과거형</td><td class="pl">Uczę się, <b>żeby</b> zdać egzamin.</td></tr>
   <tr><td class="k pl">bo</td><td>왜냐하면 (구어)</td><td>직설법</td><td class="pl">Nie idę, <b>bo</b> jestem chory.</td></tr>
   <tr><td class="k pl">ponieważ</td><td>왜냐하면 (격식)</td><td>직설법</td><td class="pl"><b>Ponieważ</b> padało, zostałem w domu.</td></tr>
   <tr><td class="k pl">chociaż</td><td>비록 ~이지만</td><td>직설법</td><td class="pl"><b>Chociaż</b> było zimno, poszliśmy.</td></tr>
   <tr><td class="k pl">jeśli</td><td>만약 ~라면 (실현 가능)</td><td>직설법</td><td class="pl"><b>Jeśli</b> będę miał czas, przyjdę.</td></tr>
   <tr><td class="k pl">gdyby</td><td>만약 ~라면 (가정)</td><td>조건법</td><td class="pl"><b>Gdybym</b> miał czas, przyszedłbym.</td></tr>
   </tbody></table></div>
   <h4>żeby의 두 얼굴</h4>
   <p>주어가 <b>같으면</b> 부정형: <span class="pl">Uczę się, żeby <b>zdać</b> egzamin.</span> 시험에 붙으려고 공부한다.<br>
   주어가 <b>다르면</b> 과거형(조건법 어간): <span class="pl">Chcę, żebyś <b>przyszedł</b>.</span> 네가 오면 좋겠어.</p>
   <p><b>쉼표를 잊지 마세요</b> — 폴란드어는 종속절 앞에 항상 쉼표를 찍습니다.</p>`,
   drills:[["Myślę, ___ masz rację.","że","네 말이 맞다고 생각해."],
           ["Uczę się, ___ zdać egzamin.","żeby","시험에 붙으려고 공부한다."],
           ["Nie idę, ___ jestem chory.","bo","아파서 안 간다."],
           ["Chcę, ___ przyszedł.","żebyś","네가 왔으면 좋겠어."]]},

  {id:"imieslow",lv:"B2",t:"형동사 — 절을 한 단어로 접기",p:"Imiesłowy przymiotnikowe",
   html:`<p>글말 폴란드어는 관계절을 통째로 <b>한 단어</b>로 줄입니다. B2부터 읽기에서 계속 만납니다.</p>
   <p class="pl" style="font-size:17px">Człowiek, <b>który czyta</b> gazetę → człowiek <b>czytający</b> gazetę<br>
   Książka, <b>którą przeczytano</b> → <b>przeczytana</b> książka</p>
   <h4>능동 형동사 (-ący)</h4>
   <p>현재 3인칭 복수에서 <span class="mono">-ą</span>를 떼고 <span class="mono">-ący</span>를 붙입니다. <b>불완료상에만</b> 있습니다.</p>
   <p class="pl" style="font-size:16px">robią → <b>robiący</b> · czytają → <b>czytający</b> · piszą → <b>piszący</b> · idą → <b>idący</b></p>
   <p>형용사처럼 성·수·격에 맞춰 변합니다: <span class="pl">czytający student, czytająca kobieta, czytające dziecko</span></p>
   <h4>피동 형동사 (-ny / -ony / -ty)</h4>
   <div class="scroll-x"><table class="tb"><thead><tr><th>어미</th><th>언제</th><th>예</th></tr></thead><tbody>
   <tr><td class="k mono">-ny</td><td>-ać 동사</td><td class="pl">czytać → czytany, napisać → napisany</td></tr>
   <tr><td class="k mono">-ony</td><td>-ić / -eć 동사</td><td class="pl">robić → robiony, zrobić → zrobiony</td></tr>
   <tr><td class="k mono">-ty</td><td>-ąć, -ić(단음절) 등</td><td class="pl">wziąć → wzięty, zamknąć → zamknięty, pić → pity</td></tr>
   </tbody></table></div>
   <p><b>타동사만</b> 피동 형동사를 만듭니다. <span class="pl">iść, być</span>처럼 목적어를 못 받는 동사에는 없습니다.</p>`,
   drills:[["Człowiek ___ (czytać) gazetę siedzi obok.","czytający","신문을 읽고 있는 사람이 옆에 앉아 있다."],
           ["To jest ___ (napisać) przeze mnie list.","napisany","이건 내가 쓴 편지다."],
           ["___ (zamknąć) drzwi nie otwierają się.","Zamknięte","닫힌 문은 열리지 않는다. — 중성 복수 drzwi"],
           ["Widzę ___ (pracować) ludzi.","pracujących","일하는 사람들이 보인다. — 남성인간 복수 대격"]]},

  {id:"przyslow",lv:"B2",t:"부동사 — ~하면서, ~하고 나서",p:"Imiesłowy przysłówkowe",
   html:`<p>부동사는 <b>변하지 않는</b> 형태로, 두 동작의 시간 관계를 한 단어로 나타냅니다.</p>
   <div class="scroll-x"><table class="tb"><thead><tr><th>형태</th><th>어미</th><th>뜻</th><th>상</th></tr></thead><tbody>
   <tr><td class="k">현재 부동사</td><td class="mono">-ąc</td><td>~하면서 (동시)</td><td>불완료상만</td></tr>
   <tr><td class="k">과거 부동사</td><td class="mono">-wszy / -łszy</td><td>~하고 나서 (선행)</td><td>완료상만</td></tr>
   </tbody></table></div>
   <p class="pl" style="font-size:17px"><b>Czytając</b> gazetę, piłem kawę. 신문을 읽으면서 커피를 마셨다.<br>
   <b>Przeczytawszy</b> gazetę, wyszedłem. 신문을 다 읽고 나서 나갔다.</p>
   <h4>반드시 지켜야 할 규칙</h4>
   <p><b>주절과 주어가 같아야 합니다.</b> 다르면 비문이 됩니다.<br>
   ✓ <span class="pl">Wracając do domu, spotkałem Annę.</span> (돌아온 사람 = 만난 사람)<br>
   ✗ <span class="pl">Wracając do domu, zaczął padać deszcz.</span> — 비가 집에 돌아온 게 되어 버립니다.</p>
   <p><span class="pl">-łszy</span>는 어간이 자음으로 끝날 때 씁니다: <span class="pl">przyszedł → przyszedłszy, zjadł → zjadłszy</span>. 과거 부동사는 글말·문학어에 주로 쓰이고 회화에서는 드뭅니다.</p>`,
   drills:[["___ (czytać) gazetę, piłem kawę.","Czytając","신문을 읽으면서 커피를 마셨다."],
           ["___ (zrobić) zadanie, poszedł spać.","Zrobiwszy","과제를 다 하고 나서 자러 갔다."],
           ["___ (wracać) do domu, spotkałem Annę.","Wracając","집에 돌아오면서 안나를 만났다."]]},

  {id:"bierna",lv:"B2",t:"수동태 — być와 zostać",p:"Strona bierna",
   html:`<p>수동태는 <b>być 또는 zostać + 피동 형동사</b>입니다. 둘의 차이가 핵심입니다.</p>
   <div class="scroll-x"><table class="tb"><thead><tr><th></th><th>구성</th><th>뜻</th><th>예</th></tr></thead><tbody>
   <tr><td class="k">być + 불완료</td><td class="pl">jest budowany</td><td>상태·진행</td><td class="pl">Dom jest budowany. 집이 지어지는 중이다.</td></tr>
   <tr><td class="k">zostać + 완료</td><td class="pl">został zbudowany</td><td>완결된 사건</td><td class="pl">Dom został zbudowany. 집이 지어졌다.</td></tr>
   </tbody></table></div>
   <h4>행위자는 przez + 대격</h4>
   <p class="pl" style="font-size:17px">List został napisany <b>przez Annę</b>. 편지는 안나에 의해 쓰였다.</p>
   <h4>능동 ↔ 수동</h4>
   <p class="pl" style="font-size:16px">Anna napisała list. → List został napisany przez Annę.<br>
   Budują nowy most. → Nowy most jest budowany.</p>
   <p>피동 형동사는 주어의 <b>성·수·격</b>에 맞춰 변합니다: <span class="pl">list został napisany / książka została napisana / listy zostały napisane</span></p>`,
   drills:[["Dom ___ (zostać) zbudowany w zeszłym roku.","został","집은 작년에 지어졌다."],
           ["Książka ___ (zostać) napisana przez Annę.","została","책은 안나에 의해 쓰였다. — 여성"],
           ["Ten most ___ (być) budowany od dwóch lat.","jest","이 다리는 2년째 지어지는 중이다."]]},

  {id:"nono",lv:"B2",t:"무인칭 과거 -no / -to",p:"Formy bezosobowe -no/-to",
   html:`<p>행위자를 밝히지 않고 "~했다"를 말하는 폴란드어 특유의 형태입니다. 신문·공문서에 아주 많습니다.</p>
   <p>피동 형동사에서 어미만 <span class="mono">-no</span> 또는 <span class="mono">-to</span>로 바꿉니다. <b>주어도 없고 성·수도 없습니다.</b></p>
   <div class="scroll-x"><table class="tb"><thead><tr><th>동사</th><th>피동 형동사</th><th>무인칭</th><th>뜻</th></tr></thead><tbody>
   <tr><td class="k pl">zbudować</td><td class="pl">zbudowany</td><td class="pl" style="font-weight:640">zbudowano</td><td>지어졌다</td></tr>
   <tr><td class="k pl">otworzyć</td><td class="pl">otwarty</td><td class="pl" style="font-weight:640">otwarto</td><td>열렸다</td></tr>
   <tr><td class="k pl">powiedzieć</td><td class="pl">powiedziany</td><td class="pl" style="font-weight:640">powiedziano</td><td>~라고 했다</td></tr>
   <tr><td class="k pl">znaleźć</td><td class="pl">znaleziony</td><td class="pl" style="font-weight:640">znaleziono</td><td>발견되었다</td></tr>
   <tr><td class="k pl">zamknąć</td><td class="pl">zamknięty</td><td class="pl" style="font-weight:640">zamknięto</td><td>닫혔다</td></tr>
   </tbody></table></div>
   <p class="pl" style="font-size:17px"><b>Zbudowano</b> nowy most. 새 다리가 지어졌다.<br>
   W gazecie <b>napisano</b>, że… 신문에 ~라고 실렸다.</p>
   <p><b>목적어는 대격 그대로</b>입니다 — 수동태와 달리 주어로 올라가지 않습니다: <span class="pl">Otwarto <b>nową szkołę</b>.</span></p>
   <p>현재형에 해당하는 것은 <span class="pl">się</span> 구문입니다: <span class="pl">Tu <b>mówi się</b> po polsku.</span> 여기서는 폴란드어를 씁니다.</p>`,
   drills:[["___ (zbudować) nowy most.","Zbudowano","새 다리가 지어졌다."],
           ["W gazecie ___ (napisać), że…","napisano","신문에 ~라고 실렸다."],
           ["Tu ___ się po polsku. (mówić)","mówi","여기서는 폴란드어를 씁니다."]]},

  {id:"odslow",lv:"B2",t:"동명사 — 동사를 명사로",p:"Rzeczownik odsłowny",
   html:`<p>동사에 <span class="mono">-nie</span> 또는 <span class="mono">-cie</span>를 붙이면 중성 명사가 됩니다. 한국어의 '~하기 / ~함'에 해당해요.</p>
   <p class="pl" style="font-size:16px">czytać → <b>czytanie</b> 읽기 · pisać → <b>pisanie</b> 쓰기 · robić → <b>robienie</b> 하기 ·
   uczyć się → <b>uczenie się</b> 배우기 · picie 마시기 · mycie 씻기</p>
   <h4>명사이므로 격변화한다</h4>
   <p class="pl" style="font-size:16px">Lubię <b>czytanie</b>. (대격) · Nie lubię <b>czytania</b>. (속격) · Zajmuję się <b>czytaniem</b>. (조격)</p>
   <h4>목적어는 속격으로 바뀐다</h4>
   <p>동사일 때는 대격이던 목적어가, 동명사 뒤에서는 <b>속격</b>이 됩니다.<br>
   <span class="pl">czytać <b>książkę</b></span> → <span class="pl">czytanie <b>książki</b></span><br>
   <span class="pl">uczyć się <b>polskiego</b></span> → <span class="pl">uczenie się <b>polskiego</b></span></p>
   <p>상도 유지됩니다: <span class="pl">czytanie</span>(불완료, 읽는 행위) ↔ <span class="pl">przeczytanie</span>(완료, 다 읽음)</p>`,
   drills:[["Lubię ___ (czytać → 동명사) książek.","czytanie","나는 책 읽기를 좋아한다."],
           ["Zajmuję się ___ (pisanie, 조격).","pisaniem","나는 글쓰기를 한다."],
           ["Nie lubię ___ (mycie, 속격) naczyń.","mycia","설거지를 싫어한다."]]},

  {id:"iterat",lv:"B2",t:"반복상 동사 — bywać, czytywać",p:"Czasowniki wielokrotne",
   html:`<p>불완료상 안에 한 겹이 더 있습니다. <b>반복상</b>은 "가끔, 때때로 ~하곤 한다"를 나타냅니다.</p>
   <div class="scroll-x"><table class="tb"><thead><tr><th>기본</th><th>반복상</th><th>뜻</th></tr></thead><tbody>
   <tr><td class="k pl">być</td><td class="pl" style="font-weight:640">bywać</td><td>가끔 ~이곤 하다</td></tr>
   <tr><td class="k pl">czytać</td><td class="pl" style="font-weight:640">czytywać</td><td>이따금 읽곤 하다</td></tr>
   <tr><td class="k pl">pisać</td><td class="pl" style="font-weight:640">pisywać</td><td>이따금 쓰곤 하다</td></tr>
   <tr><td class="k pl">jeść</td><td class="pl" style="font-weight:640">jadać</td><td>보통 먹곤 하다</td></tr>
   <tr><td class="k pl">mieć</td><td class="pl" style="font-weight:640">miewać</td><td>이따금 겪곤 하다</td></tr>
   <tr><td class="k pl">widzieć</td><td class="pl" style="font-weight:640">widywać</td><td>이따금 보곤 하다</td></tr>
   <tr><td class="k pl">siedzieć</td><td class="pl" style="font-weight:640">siadywać</td><td>앉아 있곤 하다</td></tr>
   </tbody></table></div>
   <p class="pl" style="font-size:17px"><b>Bywam</b> tam czasem. 나는 가끔 거기에 간다.<br>
   <b>Miewam</b> bóle głowy. 나는 이따금 두통을 겪는다.<br>
   <b>Jadamy</b> obiad o drugiej. 우리는 보통 2시에 점심을 먹는다.</p>
   <p>표시는 대개 <span class="mono">-ywać / -iwać / -ać</span>입니다. 회화보다 글말에서 더 자주 보이지만, <span class="pl">bywać</span>와 <span class="pl">miewać</span>는 일상에서도 흔합니다.</p>`,
   drills:[["___ (bywać) tam czasem.","Bywam","나는 가끔 거기 간다."],
           ["___ (miewać) bóle głowy.","Miewam","이따금 두통이 있다."],
           ["Gdzie ___ (jadać) obiad?","jadacie","너희는 보통 어디서 점심을 먹니?"]]},

  {id:"slowotw",lv:"B2",t:"단어 만들기 — 접미사",p:"Słowotwórstwo",
   html:`<p>접미사를 알면 모르는 단어의 뜻을 짐작할 수 있습니다. 어휘를 외우는 속도가 달라집니다.</p>
   <div class="scroll-x"><table class="tb"><thead><tr><th>접미사</th><th>만드는 것</th><th>예</th></tr></thead><tbody>
   <tr><td class="k mono">-ość</td><td>형용사 → 추상명사 (여성)</td><td class="pl">wolny → wolność · możliwy → możliwość</td></tr>
   <tr><td class="k mono">-anie / -enie</td><td>동사 → 동명사 (중성)</td><td class="pl">czytać → czytanie · robić → robienie</td></tr>
   <tr><td class="k mono">-arz / -ciel</td><td>사람 (직업)</td><td class="pl">piekarz 제빵사 · nauczyciel 교사</td></tr>
   <tr><td class="k mono">-nik / -ownik</td><td>사람·도구</td><td class="pl">pracownik 직원 · czajnik 주전자</td></tr>
   <tr><td class="k mono">-ka</td><td>여성형 · 지소사</td><td class="pl">nauczycielka · książka</td></tr>
   <tr><td class="k mono">-stwo</td><td>집합·상태 (중성)</td><td class="pl">społeczeństwo · państwo</td></tr>
   <tr><td class="k mono">-owy / -ny</td><td>명사 → 형용사</td><td class="pl">dom → domowy · praca → pracowity</td></tr>
   <tr><td class="k mono">nie-</td><td>반대</td><td class="pl">możliwy → niemożliwy</td></tr>
   <tr><td class="k mono">bez-</td><td>~이 없는</td><td class="pl">bezpłatny 무료의 · bezsensowny 무의미한</td></tr>
   </tbody></table></div>
   <p><b>연습</b> — <span class="pl">wolność, ciekawość, trudność, wartość</span>는 모두 <span class="mono">-ość</span>로 끝나므로 전부 <b>여성</b>이고, 속격은 <span class="mono">-ości</span>입니다. 하나를 알면 나머지도 압니다.</p>`,
   drills:[["wolny → ___ (자유)","wolność","형용사 + -ość → 추상명사"],
           ["możliwy → ___ (가능성)","możliwość","-ość는 항상 여성"],
           ["czytać → ___ (읽기)","czytanie","동사 + -anie → 동명사"]]},

  {id:"spojnik2",lv:"B2",t:"복합 접속과 문장 늘리기",p:"Spójniki złożone",
   html:`<p>B2에서는 문장이 길어집니다. 아래 표현들이 글의 뼈대가 됩니다.</p>
   <div class="scroll-x"><table class="tb"><thead><tr><th>표현</th><th>뜻</th><th>예</th></tr></thead><tbody>
   <tr><td class="k pl">mimo że</td><td>비록 ~이지만</td><td class="pl">Mimo że padało, wyszliśmy.</td></tr>
   <tr><td class="k pl">pomimo</td><td>~에도 불구하고 (+속격)</td><td class="pl">Pomimo deszczu wyszliśmy.</td></tr>
   <tr><td class="k pl">dzięki temu, że</td><td>~덕분에</td><td class="pl">Dzięki temu, że pomogłeś…</td></tr>
   <tr><td class="k pl">w związku z tym</td><td>이와 관련하여</td><td class="pl">W związku z tym proszę o…</td></tr>
   <tr><td class="k pl">o ile</td><td>~하는 한</td><td class="pl">O ile wiem, jest zamknięte.</td></tr>
   <tr><td class="k pl">pod warunkiem, że</td><td>~라는 조건으로</td><td class="pl">Przyjdę pod warunkiem, że…</td></tr>
   <tr><td class="k pl">zanim</td><td>~하기 전에</td><td class="pl">Zanim wyjdziesz, zamknij okno.</td></tr>
   <tr><td class="k pl">podczas gdy</td><td>~하는 동안, 반면에</td><td class="pl">Podczas gdy on spał…</td></tr>
   <tr><td class="k pl">tym bardziej, że</td><td>더욱이 ~이므로</td><td class="pl">…tym bardziej, że jest późno.</td></tr>
   <tr><td class="k pl">niemniej jednak</td><td>그럼에도 불구하고</td><td class="pl">Niemniej jednak warto spróbować.</td></tr>
   </tbody></table></div>
   <p><b>쉼표 규칙</b> — <span class="pl">że, który, żeby, ponieważ, mimo że, zanim</span> 앞에는 언제나 쉼표를 찍습니다. 폴란드어는 영어와 달리 생략할 수 없습니다.</p>`,
   drills:[["___ że padało, wyszliśmy.","Mimo","비가 왔는데도 우리는 나갔다."],
           ["___ wyjdziesz, zamknij okno.","Zanim","나가기 전에 창문을 닫아."],
           ["___ temu, że pomogłeś, zdążyłem.","Dzięki","네가 도와준 덕분에 제때 했어."]]},

  {id:"prefiks",lv:"C1",t:"접두사의 의미 체계",p:"Prefiksy czasownikowe",
   html:`<p>폴란드어 동사는 접두사 하나로 뜻이 통째로 바뀝니다. C1에서는 접두사 자체의 의미를 알아야 사전 없이 읽힙니다.</p>
   <div class="scroll-x"><table class="tb"><thead><tr><th>접두사</th><th>핵심 의미</th><th>예 (pisać 쓰다)</th></tr></thead><tbody>
   <tr><td class="k mono">na-</td><td>표면에·충분히</td><td class="pl">napisać 다 쓰다 · nauczyć się 배워 내다</td></tr>
   <tr><td class="k mono">prze-</td><td>가로질러·다시·지나치게</td><td class="pl">przepisać 옮겨 쓰다 · przeczytać 통독하다</td></tr>
   <tr><td class="k mono">za-</td><td>시작·너머로·채움</td><td class="pl">zapisać 적어 두다 · zacząć 시작하다</td></tr>
   <tr><td class="k mono">wy-</td><td>밖으로·끝까지</td><td class="pl">wypisać 발급하다 · wyjść 나가다</td></tr>
   <tr><td class="k mono">o- / ob-</td><td>둘레를·대상을</td><td class="pl">opisać 묘사하다 · obejść 돌아가다</td></tr>
   <tr><td class="k mono">pod-</td><td>아래·몰래·약간</td><td class="pl">podpisać 서명하다 · podejść 다가가다</td></tr>
   <tr><td class="k mono">roz-</td><td>흩어짐·펼침</td><td class="pl">rozpisać 나눠 적다 · rozejść się 흩어지다</td></tr>
   <tr><td class="k mono">do-</td><td>도달·보탬</td><td class="pl">dopisać 덧붙여 쓰다 · dojść 다다르다</td></tr>
   <tr><td class="k mono">od-</td><td>떨어짐·되돌림</td><td class="pl">odpisać 답장하다 · odejść 떠나다</td></tr>
   <tr><td class="k mono">s- / z-</td><td>완결·합침</td><td class="pl">spisać 목록으로 적다 · zrobić 해내다</td></tr>
   </tbody></table></div>
   <p>같은 접두사가 여러 동사에 같은 논리로 붙습니다. <span class="pl">pod-</span>는 늘 '아래·다가감'이라 <span class="pl">podejść</span>(다가가다), <span class="pl">podpisać</span>(밑에 쓰다=서명), <span class="pl">podać</span>(건네다)로 이어집니다.</p>
   <p><b>주의</b> — 접두사를 붙이면 대개 <b>완료상</b>이 되고, 다시 불완료상을 만들려면 <span class="mono">-ywać/-iwać</span>를 씁니다: <span class="pl">pisać → zapisać → zapisywać</span></p>`,
   drills:[["___pisać = 서명하다","pod","밑에 쓰다 → 서명"],
           ["___pisać = 답장하다","od","되돌려 쓰다 → 답장"],
           ["___pisać = 묘사하다","o","대상을 둘러 쓰다 → 묘사"]]},

  {id:"styl",lv:"C1",t:"문체 — 구어체와 격식체",p:"Styl potoczny i oficjalny",
   html:`<p>C1은 "맞는 문장"을 넘어 <b>상황에 맞는 문장</b>을 요구합니다. 같은 뜻도 자리에 따라 단어가 달라집니다.</p>
   <div class="scroll-x"><table class="tb"><thead><tr><th>구어체</th><th>격식체</th><th>뜻</th></tr></thead><tbody>
   ${REGISTER.slice(1,15).map(r=>`<tr><td class="k pl">${r[0]}</td>
     <td class="pl" style="font-weight:640;color:var(--c6)">${r[1]}</td><td>${r[2]}</td></tr>`).join("")}
   </tbody></table></div>
   <h4>격식체의 특징</h4>
   <p>① <b>무인칭·수동 선호</b> — <span class="pl">Zrobiłem to</span> 대신 <span class="pl">Zostało to wykonane</span> / <span class="pl">Dokonano tego</span><br>
   ② <b>명사화</b> — <span class="pl">zmienić</span> 대신 <span class="pl">dokonać zmiany</span><br>
   ③ <b>형동사·부동사</b>를 많이 씀<br>
   ④ 접속사도 격식형: <span class="pl">bo → ponieważ</span>, <span class="pl">ale → natomiast</span></p>
   <h4>편지 틀</h4>
   <p class="pl" style="font-size:16px"><b>Szanowni Państwo,</b><br>
   w nawiązaniu do Państwa ogłoszenia zwracam się z prośbą o…<br>
   W załączeniu przesyłam wymagane dokumenty.<br>
   <b>Z poważaniem,</b><br>Jan Kowalski</p>`,
   drills:[["격식체로: dostać → ___","otrzymać","받다"],
           ["격식체로: bo → ___","ponieważ","왜냐하면"],
           ["격식체로: teraz → ___","obecnie","현재"]]},

  {id:"frazeo",lv:"C1",t:"관용구 — 직역하면 안 되는 말",p:"Frazeologia",
   html:`<p>C1의 관문입니다. 단어를 다 알아도 뜻이 안 나오는 표현들이에요.</p>
   <div class="scroll-x"><table class="tb"><thead><tr><th>관용구</th><th>뜻</th><th>직역</th></tr></thead><tbody>
   ${["bułka z masłem","trzymać kciuki","robić z igły widły","owijać w bawełnę",
      "mieć głowę na karku","dolewać oliwy do ognia","wziąć się w garść",
      "puścić coś mimo uszu","wyjść na jaw","być w siódmym niebie"]
     .map(k=>{const w=(DECKS.find(d=>d.id==="idiom")||{w:[]}).w.find(x=>x[0]===k);
       return w?`<tr><td class="k pl">${w[0]}</td><td>${w[1]}</td>
       <td style="color:var(--ink-3);font-size:13px">${w[3]||""}</td></tr>`:"";}).join("")}
   </tbody></table></div>
   <p><b>익히는 법</b> — 관용구는 통째로, 그리고 <b>쓰이는 상황과 함께</b> 외워야 합니다. 단어를 따로 아는 것은 도움이 되지 않아요.<br>
   <span class="pl">— Zdasz ten egzamin?<br>— Spokojnie, <b>bułka z masłem</b>.</span> 걱정 마, 식은 죽 먹기야.</p>
   <p>단어장의 <b>관용구</b> 덱에서 22개를 카드로 익히고, 퀴즈의 <b>관용구</b> 유형으로 점검하세요.</p>`,
   drills:[["식은 죽 먹기: bułka z ___","masłem","버터 바른 빵"],
           ["행운을 빌다: trzymać ___","kciuki","엄지를 쥐다"],
           ["에둘러 말하다: owijać w ___","bawełnę","솜으로 감싸다"]]},

  {id:"szyk",lv:"C1",t:"어순과 강조",p:"Szyk wyrazów",
   html:`<p>폴란드어는 격이 역할을 표시하므로 어순이 자유롭습니다. 그 자유는 <b>강조를 위해</b> 씁니다.</p>
   <p class="pl" style="font-size:16px">Anna czyta książkę. — 중립<br>
   Książkę czyta Anna. — <b>안나가</b> (다른 사람이 아니라)<br>
   Czyta Anna książkę. — 지금 벌어지는 일에 초점</p>
   <p><b>새 정보는 문장 끝에</b> 옵니다. 한국어와 같은 원리예요.<br>
   <span class="pl">Kto czyta książkę? — Książkę czyta <b>Anna</b>.</span></p>
   <h4>대명사와 się의 자리</h4>
   <p>짧은 대명사(<span class="pl">go, mu, cię, mi</span>)와 <span class="pl">się</span>는 <b>문장 첫머리에 오지 않습니다</b>.<br>
   ✗ <span class="pl">Się nazywam Jan.</span> ✓ <span class="pl">Nazywam się Jan.</span><br>
   ✗ <span class="pl">Mu dałem książkę.</span> ✓ <span class="pl">Dałem mu książkę.</span></p>
   <h4>to로 강조하기</h4>
   <p class="pl" style="font-size:16px">To Anna napisała ten list. 이 편지를 쓴 건 바로 안나다.<br>
   To właśnie o tym mówiłem. 내가 말한 게 바로 그거야.</p>`,
   drills:[["___ nazywam się Jan. (się의 자리)","Nazywam","się는 첫머리에 오지 않는다"],
           ["Dałem ___ książkę. (그에게)","mu","짧은 형 여격"],
           ["___ Anna napisała ten list. (강조)","To","to + 주어로 강조"]]},

  {id:"zdrob",lv:"C1",t:"지소사와 확대사",p:"Zdrobnienia i zgrubienia",
   html:`<p>폴란드어는 크기·친밀감·평가를 <b>어미로</b> 표현합니다. 회화에서 대단히 자주 쓰여, 모르면 어색하게 들립니다.</p>
   <div class="scroll-x"><table class="tb"><thead><tr><th>기본</th><th>지소사 (작은·친근한)</th><th>확대사 (크고 거친)</th></tr></thead><tbody>
   <tr><td class="k pl">kot 고양이</td><td class="pl" style="color:var(--c4)">kotek, koteczek</td><td class="pl" style="color:var(--c7)">kocur</td></tr>
   <tr><td class="k pl">dom 집</td><td class="pl" style="color:var(--c4)">domek</td><td class="pl" style="color:var(--c7)">domisko</td></tr>
   <tr><td class="k pl">chleb 빵</td><td class="pl" style="color:var(--c4)">chlebek</td><td class="pl" style="color:var(--c7)">—</td></tr>
   <tr><td class="k pl">kawa 커피</td><td class="pl" style="color:var(--c4)">kawka</td><td class="pl" style="color:var(--c7)">—</td></tr>
   <tr><td class="k pl">ręka 손</td><td class="pl" style="color:var(--c4)">rączka</td><td class="pl" style="color:var(--c7)">łapa</td></tr>
   <tr><td class="k pl">pies 개</td><td class="pl" style="color:var(--c4)">piesek</td><td class="pl" style="color:var(--c7)">psisko</td></tr>
   <tr><td class="k pl">Anna</td><td class="pl" style="color:var(--c4)">Ania, Anka, Aneczka</td><td class="pl" style="color:var(--c7)">—</td></tr>
   </tbody></table></div>
   <p><b>지소사는 작다는 뜻만이 아닙니다.</b> 다정함·공손함·가벼움을 담습니다.<br>
   <span class="pl">Kawka?</span> 커피 한잔 할까? — <span class="pl">Kawa?</span>보다 훨씬 부드럽습니다.<br>
   <span class="pl">Chwileczkę!</span> 잠깐만요! — <span class="pl">Chwila</span>의 지소사로, 공손한 요청이 됩니다.</p>
   <p>주요 어미: <span class="mono">-ek, -ka, -ko, -eczek, -uszek, -yk</span>(지소사) / <span class="mono">-isko, -ysko, -ur</span>(확대사)</p>`,
   drills:[["dom의 지소사","domek","작은 집·정겨운 집"],
           ["kawa의 지소사","kawka","커피 한잔 (부드러운 제안)"],
           ["'잠깐만요'의 공손한 형태: ___","Chwileczkę","chwila의 지소사"]]},

  {id:"synon",lv:"C1",t:"유의어 변별",p:"Synonimy i różnice",
   html:`<p>C1에서 점수가 갈리는 지점입니다. 사전에는 같은 한국어로 나오지만 쓰임이 다릅니다.</p>
   <div class="scroll-x"><table class="tb"><thead><tr><th>짝</th><th>차이</th><th>예</th></tr></thead><tbody>

/* ---- 격변화 자동 생성 엔진 ----
   폴란드어 격변화가 전부 불규칙한 것은 아니다. 실제로 불확실한 구간은 좁다.
   여기서는 규칙을 코드로 적고, 손으로 검증한 명사 123개로 정답률을 실측한다.
   통과하지 못하는 패턴에는 쓰지 않는다.                                     */

/* -e 앞에서 일어나는 자음 연음화. 긴 덩어리를 먼저 본다. */
const SOFTEN=[["sł","śl"],["st","ści"],["zd","ździ"],["sn","śni"],["zn","źni"],
  ["ch","sz"],["k","c"],["g","dz"],["r","rz"],["ł","l"],
  ["t","ci"],["d","dzi"],["s","si"],["z","zi"],["n","ni"],
  ["b","bi"],["p","pi"],["m","mi"],["w","wi"],["f","fi"]];
function soften(stem){
  for(const [a,b] of SOFTEN){
    if(stem.endsWith(a))return stem.slice(0,-a.length)+b;
  }
  return stem;
}
/* 연음 앞 모음 교체. ia→ie 는 규칙적이고, 바탕이 a 뿐인 소수는 사전적이라 표로 둔다. */
const AE_STEMS={lat:"lec", las:"les", wiatr:"wietrz", kwiat:"kwiec",
                obiad:"obiedz", sasiad:"sąsiedz", swiat:"świec"};
function vowelShift(stem){
  if(AE_STEMS[stem])return null;              /* 예외는 규칙으로 만들지 않는다 */
  const i=stem.lastIndexOf("ia");
  return i>=0 ? stem.slice(0,i)+"ie"+stem.slice(i+2) : stem;
}
const isVelar=st=>/[kg]$/.test(st);
const isSoftEnd=st=>/[ćśźńlj]$/.test(st)||/[aeiouyąę]$/.test(st);
const isHardened=st=>/(cz|sz|rz|dz|[cżj])$/.test(st);

/* 여성 -a 명사: 주격|속격|여격|대격|조격|전치격|호격 */
function declFemA(nom){
  if(!/a$/.test(nom))return null;
  const st=nom.slice(0,-1);
  let gen, datLoc;
  if(isVelar(st)){ gen=st+"i"; datLoc=soften(st)+"e"; }
  else if(st.endsWith("i")){ gen=st; datLoc=st; }
  else if(isSoftEnd(st)){ gen=st+"i"; datLoc=st+"i"; }
  else if(isHardened(st)){ gen=st+"y"; datLoc=st+"y"; }
  else { gen=st+"y"; datLoc=soften(st)+"e"; }
  return [nom, gen, datLoc, st+"ę", st+"ą", datLoc, st+"o"];
}
/* 중성 -o 명사 */
function declNeutO(nom){
  if(!/o$/.test(nom))return null;
  const st=nom.slice(0,-1);
  const ins=isVelar(st)?st+"iem":st+"em";
  let loc;
  if(isVelar(st)||st.endsWith("ch"))loc=st+"u";
  else{
    const vs=vowelShift(st);
    if(vs===null)return null;                 /* a→e 예외는 손으로 넣어야 한다 */
    loc=soften(vs)+"e";
  }
  return [nom, st+"a", st+"u", nom, ins, loc, nom];
}
/* 중성 -um: 단수는 전혀 변하지 않는다 */
function declNeutUm(nom){
  return /um$/.test(nom)?[nom,nom,nom,nom,nom,nom,nom]:null;
}
/* 중성 -e 명사 (mieszkanie, morze…) */
function declNeutE(nom){
  if(!/e$/.test(nom))return null;
  const st=nom.slice(0,-1);
  return [nom, st+"a", st+"u", nom, st+"em", st+"u", nom];
}
/* 성과 어미로 적절한 규칙을 고른다. 다룰 수 없으면 null. */
function autoDecline(nom,g){
  if(/\s/.test(nom))return null;              /* 여러 단어짜리 표현은 제외 */
  if(g==="f")return declFemA(nom);
  if(g==="n"){ return /um$/.test(nom)?declNeutUm(nom)
    : /o$/.test(nom)?declNeutO(nom) : /e$/.test(nom)?declNeutE(nom) : null; }
  return null;                                 /* 남성은 속격 -a/-u 가 사전적이라 제외 */
}
/* 손으로 검증한 DECL 로 정답률을 잰다 — 추측이 아니라 실측 */
function auditDecline(){
  const res={f:{ok:0,bad:0,miss:[]}, n:{ok:0,bad:0,miss:[]}, m:{skipped:0}};
  DECL.forEach(d=>{
    if(d.g==="m"){res.m.skipped++;return;}
    const got=autoDecline(d.p,d.g);
    const b=res[d.g];
    if(!got){b.bad++; b.miss.push(d.p+" → 생성 불가"); return;}
    const diff=[];
    /* 호격은 사람·애칭에 따라 -o/-u 가 갈려 규칙으로 못 잡는다. 1~6격만 본다. */
    for(let i=0;i<6;i++) if(got[i]!==d.sg[i])diff.push(`${i+1}격 ${got[i]}≠${d.sg[i]}`);
    if(diff.length){b.bad++; b.miss.push(d.p+": "+diff.join(", "));}
    else b.ok++;
  });
  return res;
}

const N_TEENS=["dziesięć","jedenaście","dwanaście","trzynaście","czternaście",
               "piętnaście","szesnaście","siedemnaście","osiemnaście","dziewiętnaście"];
const N_TENS=["","dziesięć","dwadzieścia","trzydzieści","czterdzieści",
              "pięćdziesiąt","sześćdziesiąt","siedemdziesiąt","osiemdziesiąt","dziewięćdziesiąt"];
const N_HUND=["","sto","dwieście","trzysta","czterysta",
              "pięćset","sześćset","siedemset","osiemset","dziewięćset"];
/* 1–999 한 묶음 */
function numToPl3(n){
  const out=[], h=Math.floor(n/100), r=n%100;
  if(h)out.push(N_HUND[h]);
  if(r>=10&&r<20)out.push(N_TEENS[r-10]);
  else{const t=Math.floor(r/10), o=r%10; if(t)out.push(N_TENS[t]); if(o)out.push(N_ONES[o]);}
  return out.join(" ");
}
/* tysiąc·milion·miliard는 그 자체가 남성 명사라, 앞의 수에 따라 스스로 격변화한다.
   [단수, 주격 복수(2·3·4), 속격 복수(5+)] */
const SCALES=[
  {v:1e9,f:["miliard","miliardy","miliardów"]},
  {v:1e6,f:["milion","miliony","milionów"]},
  {v:1e3,f:["tysiąc","tysiące","tysięcy"]}
];
/* 0 ~ 999 999 999 999 를 폴란드어로. 표가 아니라 규칙으로 만든다. */
function numToPl(n){
  if(n===0)return "zero";
  const out=[]; let rest=n;
  for(const s of SCALES){
    const c=Math.floor(rest/s.v);
    if(c){
      if(c!==1)out.push(numToPl3(c));          /* 1 000은 "jeden tysiąc"이 아니라 그냥 "tysiąc" */
      const a=numAgree(c);
      out.push(s.f[a==="sg"?0:a==="nomPl"?1:2]);
      rest%=s.v;
    }
  }
  if(rest)out.push(numToPl3(rest));
  return out.join(" ");
}

/* 범위 안에서 문제를 뽑는다. 전부 무작위로 뽑으면 큰 수에서 매번 아홉 자리 괴물이 나와
   연습이 안 되므로, 딱 떨어지는 수와 어중간한 수를 섞는다. */
function randomNum(max){
  const rand=()=>Math.floor(Math.random()*(max+1));
  if(max<=1000){
    const pool=DRILLNUMS.filter(n=>n<=max);          /* 큰 수가 작은 범위로 새지 않게 */
    return Math.random()<.45&&pool.length ? pool[Math.floor(Math.random()*pool.length)] : rand();
  }
  const units=[1e3,1e6,1e9].filter(u=>u<=max);
  const u=units[Math.floor(Math.random()*units.length)];
  const cap=Math.floor(max/u);                       /* 이 단위로 만들 수 있는 최대 계수 */
  const c=k=>1+Math.floor(Math.random()*Math.min(k,cap));
  const r=Math.random();
  let n;
  if(r<.30)      n=u*c(9);                                          /* milion, pięć tysięcy */
  else if(r<.55) n=u*c(999);                                        /* dwieście tysięcy */
  else if(r<.75) n=u*c(99)+Math.floor(Math.random()*1000);
  else           n=rand();                                          /* 완전 무작위 */
  return n>max?rand():n;
}
/* 헷갈리기 쉬운 숫자를 오답 보기로.
   작은 수는 15 piętnaście ↔ 50 pięćdziesiąt 짝을, 큰 수는 단위(tysiąc/milion/miliard)를 흔든다. */
function numDistract(n,k){
  const near=[], far=[];
  if(n>=10&&n<20)near.push((n-10)*10);
  if(n>=20&&n%10===0&&n<100)near.push(n/10+10);
  near.push(n+1,n-1,n+10,n-10,n+100,n-100);
  if(n>=1000){
    /* 딱 떨어지는 수라면 계수는 두고 단위만 바꿔 본다 — 단위 이름을 시험하는 보기 */
    const u=n%1e9===0?1e9:n%1e6===0?1e6:n%1e3===0?1e3:0;
    if(u){
      const c=n/u;
      [1e3,1e6,1e9].forEach(v=>{if(v!==u)far.push(c*v);});
      [c+1,c-1,c+2,c*2].forEach(x=>{if(x>0)far.push(x*u);});
    }
    const mag=Math.pow(10,String(n).length-1);
    for(let i=0;i<40;i++)far.push(mag+Math.floor(Math.random()*mag*9));
  }
  const seen=new Set([n]), out=[];
  const order=(n<1000?near.concat(far):far.concat(near)).concat(shuffle(DRILLNUMS));
  for(const c of order){
    if(out.length>=k)break;
    if(!Number.isInteger(c)||c<0||c>NMAX||seen.has(c))continue;
    seen.add(c); out.push(c);
  }
  while(out.length<k){
    const c=Math.floor(Math.random()*1000);
    if(!seen.has(c)){seen.add(c);out.push(c);}
  }
  return out;
}

/* ---- 진도 코드 ----
   단어 296개와 레슨 13개는 켜짐/꺼짐 비트열로 접어서 6비트씩 문자 하나에 담는다.
   296비트 → 50자. 통계까지 합쳐도 한 줄에 들어가 주소나 메모장에 넣기 좋다. */
const B64="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
const NUMKEYS=["read","noun","clock","date"];
const ODMKEYS=["verb","adj","part"];
const WTKEYS=["dict","plw","kow","five"];
function bitsToStr(b){let o="";for(let i=0;i<b.length;i+=6)o+=B64[parseInt(b.slice(i,i+6).padEnd(6,"0"),2)];return o;}
function strToBits(s,len){let o="";for(const c of String(s)){const v=B64.indexOf(c);if(v<0)continue;o+=v.toString(2).padStart(6,"0");}return o.slice(0,len);}
function exportCode(){
  return ["P1",
    bitsToStr(ALLWORDS.map(w=>S.known[w.p]?1:0).join("")),
    bitsToStr(LESSONS.map(l=>S.lessons[l.id]?1:0).join("")),
    [1,2,3,4,5,6,7].map(i=>S.caseStats[i].join("-")).join("."),
    S.genStats.join("-")+"-"+S.genBest,
    NUMKEYS.map(k=>S.numStats[k].join("-")).join("."),
    S.quiz.slice(-12).map(h=>h.type+"-"+h.score+"-"+h.total).join("."),
    ODMKEYS.map(k=>S.odmStats[k].join("-")).join("."),
    S.level,
    WTKEYS.map(k=>S.wtStats[k].join("-")).join(".")
  ].join("~");
}
function importCode(code){
  const p=String(code).trim().split("~");
  if(p[0]!=="P1")throw new Error("진도 코드 형식이 아닙니다. P1~ 로 시작해야 합니다.");
  const st=defState(), num=a=>a.map(Number).every(Number.isFinite);
  const kb=strToBits(p[1]||"",ALLWORDS.length);
  ALLWORDS.forEach((w,i)=>{if(kb[i]==="1"){st.known[w.p]=true;st.seen[w.p]=1;}});
  const lb=strToBits(p[2]||"",LESSONS.length);
  LESSONS.forEach((l,i)=>{if(lb[i]==="1")st.lessons[l.id]=true;});
  (p[3]||"").split(".").forEach((s,i)=>{const a=s.split("-");
    if(i<7&&a.length===2&&num(a))st.caseStats[i+1]=a.map(Number);});
  const g=(p[4]||"").split("-");
  if(g.length===3&&num(g)){st.genStats=[+g[0],+g[1]];st.genBest=+g[2];}
  (p[5]||"").split(".").forEach((s,i)=>{const a=s.split("-");
    if(NUMKEYS[i]&&a.length===2&&num(a))st.numStats[NUMKEYS[i]]=a.map(Number);});
  (p[6]||"").split(".").filter(Boolean).forEach(s=>{
    const m=s.split("-"); if(m.length!==3)return;
    const sc=+m[1], to=+m[2];
    if(Number.isFinite(sc)&&Number.isFinite(to)&&to>0)
      st.quiz.push({type:m[0],score:sc,total:to,pct:Math.round(sc/to*100)});});
  /* 아래 두 칸은 나중에 붙었다 — 없는 옛 코드도 그대로 읽힌다 */
  (p[7]||"").split(".").forEach((s,i)=>{const a=s.split("-");
    if(ODMKEYS[i]&&a.length===2&&num(a))st.odmStats[ODMKEYS[i]]=a.map(Number);});
  if(LEVELS.includes(p[8]))st.level=p[8];
  (p[9]||"").split(".").forEach((x,i)=>{const arr=x.split("-");
    if(WTKEYS[i]&&arr.length===2&&num(arr))st.wtStats[WTKEYS[i]]=arr.map(Number);});
  return st;
}

const gTag=g=>{
  const m={m:["m","남성"],f:["f","여성"],n:["n","중성"],pl:["pl-t","복수"],v:["","동사"],adj:["","형용사"],adv:["","부사"],num:["","숫자"],exp:["","표현"],"m/f":["m","남/여"]};
  const t=m[g]; return t?`<span class="chip ${t[0]}">${t[1]}</span>`:"";
};

/* ---- 격변화 헬퍼 ---- */
const DECLMAP={}; DECL.forEach(d=>DECLMAP[d.p]=d);

/* ---- 엔진을 어휘 전체에 적용 ----
   손으로 넣은 표에 없는 여성 -a · 중성 명사는 규칙으로 만든다.
   위 감사에서 생성분이 100% 일치했기 때문에 쓸 수 있는 것이고,
   엔진이 자신 없다고 거부한 것(자음 끝 여성, imię, lato…)은 그대로 비워 둔다. */
const DECL_AUTO=[];
ALLWORDS.forEach(w=>{
  if(DECLMAP[w.p])return;
  if(w.g!=="f"&&w.g!=="n")return;
  const sg=autoDecline(w.p,w.g);
  if(!sg)return;
  const e={p:w.p, ko:w.k, t:w.g, g:w.g, sg, pl:null, auto:true};
  DECL_AUTO.push(e); DECLMAP[w.p]=e;
});
const DECL_ALL=DECL.concat(DECL_AUTO);
const GENDER_KO={m:"남성",f:"여성",n:"중성"};
/* 이 명사에서 이 격을 연습해도 되는가 (호격은 사람만, 복수는 표가 있을 때만) */
function caseOK(d,ci,plural){
  if(plural&&!d.pl)return false;
  if(ci===7&&!isPerson(d))return false;
  if(ci===7&&d.auto)return false;   /* 호격 -o/-u 는 규칙으로 못 가른다 */
  return true;
}
function formOf(d,ci,plural){return (plural?d.pl:d.sg)[ci-1];}
/* 뼈대 문장에 형태를 채워 넣는다 */
function frameFill(ci,form,plural){
  const f=FRAMES[ci-1];
  return {pl:(plural?f[2]:f[0]).replace("___",form), ko:plural?f[3]:f[1]};
}
function frameBlank(ci,plural){
  const f=FRAMES[ci-1];
  return {pl:(plural?f[2]:f[0]).replace("___","______"), ko:plural?f[3]:f[1]};
}
/* 같은 명사의 다른 격 형태 = 최고의 오답 보기 */
function caseDistractors(d,ci,plural,n){
  const pool=(plural?d.pl:d.sg).filter((f,i)=>i!==ci-1);
  return distractors(pool,formOf(d,ci,plural),n);
}
function recordCase(ci,ok){
  const s=S.caseStats[ci]; if(!s)return;
  s[1]++; if(ok)s[0]++; save();
}
function recordGender(ok){
  S.genStats[1]++; if(ok)S.genStats[0]++; save();
}
const casePct=ci=>{const s=S.caseStats[ci];return s&&s[1]?Math.round(s[0]/s[1]*100):null;};

/* ---- 대화상자 ----
   file:·data:·샌드박스 iframe에서는 window.confirm이 대화상자를 띄우지 않고 곧바로 false를
   돌려준다. 그러면 "그만두기"나 "제출" 같은 확인 절차가 통째로 먹통이 된다. 직접 그린다. */
function modalShell(html){
  const bg=document.createElement("div");
  bg.className="modal-bg";
  bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(bg);
  const close=()=>{document.removeEventListener("keydown",key,true);bg.remove();};
  let onEnter=null;
  const key=e=>{
    if(e.key==="Escape"){e.preventDefault();e.stopPropagation();close();}
    else if(e.key==="Enter"){e.preventDefault();e.stopPropagation();close();if(onEnter)onEnter();}
  };
  /* 캡처 단계에서 가로채 퀴즈·시험의 Enter 핸들러와 겹치지 않게 한다 */
  document.addEventListener("keydown",key,true);
  bg.onclick=e=>{if(e.target===bg)close();};
  return {bg,close,setEnter:f=>{onEnter=f;}};
}
function askConfirm(title,body,onYes,yesLabel){
  const m=modalShell(`<h3>${esc(title)}</h3><p>${body}</p>
    <div class="inline" style="justify-content:flex-end">
      <button class="btn ghost" data-no>취소</button>
      <button class="btn red" data-yes>${esc(yesLabel||"계속")}</button></div>`);
  const go=()=>{m.close();onYes();};
  m.setEnter(onYes);
  m.bg.querySelector("[data-no]").onclick=m.close;
  m.bg.querySelector("[data-yes]").onclick=go;
  m.bg.querySelector("[data-yes]").focus();
}
function notify(title,body){
  const m=modalShell(`<h3>${esc(title)}</h3><p>${body}</p>
    <div class="inline" style="justify-content:flex-end">
      <button class="btn" data-ok>확인</button></div>`);
  m.bg.querySelector("[data-ok]").onclick=m.close;
  m.bg.querySelector("[data-ok]").focus();
}

/* TTS */
let voices=[];
function loadVoices(){voices=window.speechSynthesis?speechSynthesis.getVoices():[];}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function say(text){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(String(text).replace(/[|]/g,""));
  u.lang="pl-PL"; u.rate=.85;
  const v=voices.find(x=>x.lang&&x.lang.toLowerCase().indexOf("pl")===0);
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-say]");
  if(b){e.stopPropagation();say(b.getAttribute("data-say"));}
});

  <div class="card scroll-x"><table class="tb"><thead><tr>

  ${(()=>{let cum=0; return LEVELS.map(L=>{

  </tbody></table></div>

    ${lvLabel()} 범위에서 ${WT_N}문항씩 냅니다. 틀린 단어는 자동으로 복습 세트에 들어갑니다.</p>
  <div class="grid g2">

/* =======================================================================
   단어 시험 — 받아쓰기 · 폴란드어 쓰기 · 뜻 쓰기 · 5지선다
   ======================================================================= */
const WTMODES=[
  {id:"dict",  t:"받아쓰기",      d:"소리만 듣고 폴란드어 철자를 적습니다. 단어는 보이지 않아요."},
  {id:"plw",   t:"폴란드어 쓰기", d:"한국어 뜻을 보고 폴란드어를 직접 적습니다."},
  {id:"kow",   t:"뜻 쓰기",       d:"폴란드어를 보고 한국어 뜻을 적습니다."},
  {id:"five",  t:"5지선다",       d:"보기 다섯 개 중 고릅니다. 빠르게 훑을 때."}
];
const WT_N=10;
let wt=null;

/* 폴란드어 채점 — 발음 구별 부호를 틀린 경우는 '거의 정답'으로 따로 알려 준다 */
const stripDia=s=>String(s).toLowerCase()
  .replace(/ą/g,"a").replace(/ć/g,"c").replace(/ę/g,"e").replace(/ł/g,"l")
  .replace(/ń/g,"n").replace(/ó/g,"o").replace(/ś/g,"s").replace(/ź/g,"z").replace(/ż/g,"z");
const cleanPl=s=>String(s).trim().toLowerCase().replace(/[.,!?…]/g,"").replace(/\s+/g," ");
function judgePl(input,answer){
  const a=cleanPl(input), b=cleanPl(answer);
  if(!a)return "empty";
  if(a===b)return "ok";
  if(stripDia(a)===stripDia(b))return "diacritic";
  return "no";
}
/* 한국어 뜻 채점 — 뜻은 "형/오빠/남동생", "살다, 거주하다"처럼 여러 갈래라
   쉼표·빗금으로 끊은 조각 중 하나와 통째로 맞으면 정답으로 본다. */
const cleanKo=s=>String(s).trim().toLowerCase().replace(/[\s.·]/g,"");
function koVariants(answer){
  const out=new Set();
  const push=x=>{const c=cleanKo(x); if(c)out.add(c);};
  push(answer);
  push(answer.replace(/\([^)]*\)/g,""));          /* 괄호 주석 제거 */
  answer.replace(/\([^)]*\)/g,"").split(/[,/;·]/).forEach(push);
  answer.split(/[,/;·]/).forEach(push);
  return [...out];
}
const judgeKo=(input,answer)=>{
  const a=cleanKo(input);
  if(!a)return "empty";
  return koVariants(answer).includes(a)?"ok":"no";
};

function startWordTest(mode,deckId){
  const base=deckId?ALLWORDS.filter(w=>w.deck===deckId):wordsAt();
  /* 받아쓰기·폴란드어 쓰기에는 통문장 표현이 맞지 않는다 */
  const typing = mode==="dict"||mode==="plw";
  const pool=base.filter(w=>w.p&&w.k&&
    (!typing || (!/[?!…]/.test(w.p) && w.p.length<=22 && w.p.split(" ").length<=2)));
  if(pool.length<5){
    notify("단어가 부족합니다",
      "이 범위에는 시험을 낼 단어가 5개 미만입니다. 레벨이나 테마를 바꾸거나, 5지선다·뜻 쓰기를 골라 보세요.");
    return;
  }
  const list=pick(pool,Math.min(WT_N,pool.length));
  wt={mode, deckId, list, i:0, answers:[], results:[], done:false, recorded:false, checked:false,
      opts: mode==="five"?wtOptions(list[0]):null};
  render(); window.scrollTo(0,0);
}
function wtOptions(w){
  const others=distractors(wordsAt().map(x=>x.k),w.k,4);
  return shuffle([w.k,...others]);
}
function viewWordTest(v){
  if(wt.done)return wtResult(v);
  const w=wt.list[wt.i], m=WTMODES.find(x=>x.id===wt.mode);

  v.innerHTML=`
  <div class="qbar" style="margin-top:24px">
    <span>${String(wt.i+1).padStart(2,"0")} / ${wt.list.length}</span>
    <span class="track"><i style="width:${wt.i/wt.list.length*100}%"></i></span>
    <span>${wt.results.filter(Boolean).length}점</span>
    <button class="icon-btn" id="wtQuit">그만두기</button>
  </div>
  <div class="card pad">
    <div class="eyebrow" style="margin-bottom:14px">단어 시험 · ${m.t}</div>
    ${wt.mode==="dict"?`
      <div style="text-align:center;padding:14px 0 24px">
        ${noVoice?`<p class="lede" style="margin:0">이 브라우저는 음성 재생을 지원하지 않아 받아쓰기를 할 수 없습니다.</p>`
        :`<button class="btn" id="wtPlay" style="font-size:16px;padding:14px 26px">🔊 다시 듣기</button>
          <div style="font-size:13px;color:var(--ink-3);margin-top:12px">뜻: ${esc(w.k)}</div>`}
      </div>`
    :wt.mode==="kow"?`

      <div style="color:var(--ink-3);font-size:14px;margin-bottom:24px">${gTag(w.g)} 이 단어의 뜻을 한국어로 적으세요.</div>`
    :`
      <div class="qword" style="margin-bottom:8px">${esc(w.k)}</div>
      <div style="color:var(--ink-3);font-size:14px;margin-bottom:24px">${gTag(w.g)} ${
        wt.mode==="five"?"알맞은 뜻을 고르세요.":"폴란드어로 적으세요."}</div>`}

    ${wt.mode==="five"?`<div class="opts">${wt.opts.map((o,i)=>`<button data-o="${i}">
        <span class="k">${i+1}</span><span style="font-size:16px">${esc(o)}</span></button>`).join("")}</div>`
    :`<div class="inline">
        <input class="search" id="wtIn" style="max-width:340px;font-size:18px;font-weight:550${
          wt.mode==="kow"?"":";letter-spacing:-.015em"}"
          placeholder="${wt.mode==="kow"?"뜻을 한국어로":"폴란드어로"}" autocomplete="off"
          autocapitalize="off" spellcheck="false" ${wt.checked?"disabled":""}>
        <button class="btn" id="wtSub" ${wt.checked?"disabled":""}>확인</button>
      </div>
      ${wt.mode!=="kow"?`<div style="font-size:12.5px;color:var(--ink-3);margin-top:10px">
        ą ć ę ł ń ó ś ź ż — 발음 구별 부호가 빠지면 '거의 정답'으로 알려 드립니다.</div>`:""}`}
    <div id="wtFb"></div>

  $("#wtQuit").onclick=()=>askConfirm("시험을 그만둘까요?","지금까지 푼 내용은 채점되지 않습니다.",
    ()=>{wt=null;render();window.scrollTo(0,0);},"그만두기");
  const play=$("#wtPlay"); if(play){play.onclick=()=>say(w.p); if(!wt.checked)say(w.p);}
  if(wt.mode==="five"){
    v.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>wtAnswer(wt.opts[+b.dataset.o],b));
  }else{
    const inp=$("#wtIn");
    if(inp&&!wt.checked){inp.focus(); inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();wtAnswer(inp.value);}};}
    if($("#wtSub"))$("#wtSub").onclick=()=>wtAnswer(inp.value);
  }
}
function wtAnswer(given,btn){
  if(wt.checked)return; wt.checked=true;
  const w=wt.list[wt.i];
  const verdict = wt.mode==="kow" ? judgeKo(given,w.k)
                : wt.mode==="five" ? (given===w.k?"ok":"no")
                : judgePl(given,w.p);
  const ok = verdict==="ok" || verdict==="diacritic";
  wt.answers[wt.i]=given; wt.results[wt.i]=ok;
  if(!ok){S.known[w.p]=false;}          /* 틀린 단어는 복습 세트로 돌아온다 */
  S.seen[w.p]=1; save();
  const v=$("#view");
  if(wt.mode==="five"){
    v.querySelectorAll("[data-o]").forEach(x=>{x.disabled=true;
      const t=wt.opts[+x.dataset.o];
      if(t===w.k)x.classList.add("right"); else if(x===btn)x.classList.add("wrong");});
  }else{
    const inp=$("#wtIn"); if(inp)inp.disabled=true;
    if($("#wtSub"))$("#wtSub").disabled=true;
  }
  const last=wt.i>=wt.list.length-1;
  const tone = verdict==="ok"?"ok" : verdict==="diacritic"?"ok" : "no";
  const head = verdict==="ok"?"정답"
    : verdict==="diacritic"?"거의 정답 — 발음 구별 부호를 확인하세요"
    : verdict==="empty"?"무응답" : "오답";
  $("#wtFb").innerHTML=`<div class="qfeed ${tone}">
    <div style="font-weight:700;color:${ok?"var(--good)":"var(--bad)"};margin-bottom:6px">${head}</div>
    <b class="pl">${esc(w.p)}</b> — ${esc(w.k)}
    ${w.n?`<div style="font-size:13px;color:var(--ink-3);margin-top:4px">${esc(w.n)}</div>`:""}
    ${(verdict!=="ok"&&given)?`<div style="font-size:13.5px;margin-top:6px">
      쓴 답: <span class="yr">${esc(given)}</span></div>`:""}
    ${(()=>{const ex=sentFor(w.p,1)[0];
      return ex?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">
        <div class="pl" style="font-size:15px">${esc(ex.pl)}</div>
        <div style="font-size:12.5px;color:var(--ink-3)">${esc(ex.ko)}</div></div>`:"";})()}
    <div class="inline" style="margin-top:12px">
      <button class="btn" id="wtNext">${last?"결과 보기":"다음 →"}</button>
      <button class="icon-btn" data-say="${esc(w.p)}">🔊 듣기</button>
      ${(!ok&&wt.mode==="kow")?`<button class="icon-btn" id="wtOverride">사실 맞았어요</button>`:""}
    </div>
    ${(!ok&&wt.mode==="kow")?`<div style="font-size:12px;color:var(--ink-3);margin-top:8px">
      뜻은 여러 갈래로 적을 수 있어 자동 채점이 엄격할 수 있습니다. 맞다고 판단되면 위 버튼을 누르세요.</div>`:""}
  </div>`;
  const next=()=>{document.removeEventListener("keydown",h);
    wt.i++; wt.checked=false;
    if(wt.i>=wt.list.length)wt.done=true;
    else if(wt.mode==="five")wt.opts=wtOptions(wt.list[wt.i]);
    render(); if(wt.done)window.scrollTo(0,0);};
  $("#wtNext").onclick=next;
  const ov=$("#wtOverride");
  if(ov)ov.onclick=()=>{wt.results[wt.i]=true; S.known[w.p]=true; save();
    ov.textContent="정답 처리했습니다"; ov.disabled=true;};
  const h=e=>{if(e.key==="Enter"){e.preventDefault();next();}};
  document.addEventListener("keydown",h);
}
function wtResult(v){
  const score=wt.results.filter(Boolean).length, total=wt.list.length;
  const pct=Math.round(score/total*100);
  if(!wt.recorded){
    wt.recorded=true;
    const s=S.wtStats[wt.mode]; s[1]+=total; s[0]+=score; save();
  }
  const wrong=wt.list.map((w,i)=>({w,given:wt.answers[i],ok:wt.results[i]})).filter(x=>!x.ok);
  const m=WTMODES.find(x=>x.id===wt.mode);
  v.innerHTML=`<h2 class="sec">${m.t} 결과</h2>
  <div class="card pad" style="text-align:center">
    <div class="score" style="color:${pct>=80?"var(--good)":pct>=50?"var(--amber)":"var(--bad)"}">${pct}%</div>
    <div class="mono" style="color:var(--ink-3);margin-top:6px">${score} / ${total} 정답</div>
    <p class="lede" style="margin:14px auto 18px;text-align:center">
      ${wrong.length?`틀린 ${wrong.length}개는 <b>복습 세트</b>로 되돌려 놓았습니다. 단어장에서 바로 다시 볼 수 있어요.`
        :"전부 맞혔습니다. 다른 모드로도 확인해 보세요."}</p>
    <div class="inline" style="justify-content:center">
      <button class="btn red" id="wtAgain">다시 보기</button>
      <button class="btn ghost" id="wtBack">단어장으로</button>
    </div>
  </div>
  ${wrong.length?`<h2 class="sec">틀린 단어</h2><div class="card pad">
    ${wrong.map(x=>`<div class="wrongrow">
      <span class="pw pl">${esc(x.w.p)}</span>
      <span class="yr">${esc(x.given||"(무응답)")}</span>
      <span class="cr">${esc(wt.mode==="kow"||wt.mode==="five"?x.w.k:x.w.p)}</span>
      <span style="flex-basis:100%;font-size:13px;color:var(--ink-3)">${esc(x.w.k)}${x.w.n?" · "+esc(x.w.n):""}</span>
    </div>`).join("")}</div>`:""}`;
  const mode=wt.mode, deck=wt.deckId;
  $("#wtAgain").onclick=()=>startWordTest(mode,deck);
  $("#wtBack").onclick=()=>{wt=null;vState.deck=null;render();window.scrollTo(0,0);};
}

function startReview(){
  const pool=ALLWORDS.filter(w=>lvOK(DECKS.find(d=>d.id===w.deck).lv)&&!S.known[w.p]);
  if(!pool.length){notify("복습할 단어가 없습니다","이 레벨의 단어를 모두 외웠습니다. 훌륭해요!");return;}
  vState={deck:"__review",mode:"card",i:0,flipped:false,list:pick(pool,Math.min(20,pool.length)),query:""};
  render();
}
function bindDeckList(v){
  const q=$("#wq",v);

    const t=norm(q.value);

    $("#qres",v).innerHTML=hits.length?`<div class="card" style="margin-top:12px"><table class="wlist">
      ${hits.map(w=>`<tr><td class="w">${esc(w.p)}</td><td class="g">${gTag(w.g)}</td>

      <td class="s"><button class="icon-btn" data-say="${esc(w.p)}">🔊</button></td></tr>`).join("")}
      </table></div>`:`<p class="lede" style="margin-top:12px">검색 결과가 없습니다.</p>`;
  });
}

  v.innerHTML=`

document.addEventListener("keydown",e=>{
  if(route!=="vocab"||!vState.deck)return;

});

function checkDrill(root,i,ans){
  const box=root.querySelector(`.drill[data-i="${i}"]`);
  const inp=box.querySelector("input");
  const ok=norm(inp.value)===norm(ans);
  box.classList.remove("ok","no"); box.classList.add(ok?"ok":"no");
  const fb=box.querySelector(".fb");
  fb.className="fb "+(ok?"ok":"no");
  fb.innerHTML=ok?"정답입니다.":`정답: <span class="pl" style="font-size:16px">${esc(ans)}</span>`;
}

      openLesson=id; body.classList.remove("hidden");
      const L=LESSONS.find(x=>x.id===id);
      const isPron=id==="pron";
      body.innerHTML=L.html+`<h4>연습 문제</h4><div id="ld_${id}">`+
        L.drills.map((d,i)=>`<div class="drill" data-i="${i}">

          <div class="ko">${esc(isPron?d[2]:d[2])}</div>

          <div class="fb"></div></div>`).join("")+
        `</div><div class="inline" style="margin-top:14px">
          <button class="btn" data-done="${id}">${S.lessons[id]?"완료 취소":"레슨 완료로 표시"}</button></div>`;
      const root=body.querySelector("#ld_"+id);
      root.addEventListener("click",ev=>{
        const b=ev.target.closest("[data-ck]"); if(b)checkDrill(root,+b.dataset.ck,L.drills[+b.dataset.ck][1]);
      });
      root.addEventListener("keydown",ev=>{
        if(ev.key==="Enter"&&ev.target.dataset.in!==undefined)
          checkDrill(root,+ev.target.dataset.in,L.drills[+ev.target.dataset.in][1]);
      });
      body.querySelector("[data-done]").onclick=e2=>{
        S.lessons[id]=!S.lessons[id];save();
        el.querySelector(".mark").textContent=S.lessons[id]?"✓ 완료":"";
        e2.target.textContent=S.lessons[id]?"완료 취소":"레슨 완료로 표시";
      };
      el.scrollIntoView({behavior:"smooth",block:"start"});
    };
  });
}

/* 이미 검증된 데이터(격변화표·상 짝·활용표·비교급)에서도 문법 문항을 만든다.
   덕분에 회차마다 나오는 문제가 사실상 겹치지 않는다. */
function genGramItem(){
  const t=["case","conj","aspect","compar"][Math.floor(Math.random()*4)];
  const q=makeQ(t);
  if(!q||!q.opts||q.opts.length!==4)return null;
  /* 유형마다 무엇을 크게 보여 줄지 다르다 */
  const main = (t==="case"||t==="aspect") ? q.word : q.stem;
  const sub  = (t==="case"||t==="aspect") ? q.stem : q.word;
  return {sec:"gram", stem:main, sub, ans:q.ans, opts:q.opts, why:q.note, gen:true};
}
/* 직전 회차와 같은 지문이 다시 나오지 않게 기억해 둔다 */
let lastPassages={read:[],listen:[]};
function pickPassages(pool,n,key){
  const fresh=pool.filter(p=>!lastPassages[key].includes(p));
  const chosen=pick(fresh.length>=n?fresh:pool,n);
  lastPassages[key]=chosen;
  return chosen;
}
function buildExam(){
  const items=[];
  const gap=(row,sec)=>({sec, stem:row[0], ans:row[1],
    opts:shuffle([row[1],...row[2]]), why:row[3]});
  const lvl=EXAM_LEVELS.find(x=>x.id===examLevel)||EXAM_LEVELS[0];
  const GP = lvl.gram==="B2"?EXAM_GRAM_B2 : lvl.gram==="C1"?EXAM_GRAM_C1 : EXAM_GRAM;
  const VP = lvl.vocab==="B2"?EXAM_VOCAB_B2 : lvl.vocab==="C1"?EXAM_VOCAB_C1 : EXAM_VOCAB;
  /* 상위 레벨 시험은 생성 문항 대신 전용 문항만 쓴다 — 난이도를 지키기 위해서다 */
  const useGen = lvl.id==="B1";
  const keepLv=S.level; S.level = lvl.id==="B1"?"B1":lvl.id==="B2"?"B2":"C1";
  try{
    const gram=pick(GP,useGen?10:15).map(r=>gap(r,"gram"));
    const seen=new Set(gram.map(g=>g.stem));
    if(useGen)for(let guard=0; gram.length<15 && guard<200; guard++){
      const g=genGramItem();
      if(!g||seen.has(g.stem))continue;
      seen.add(g.stem); gram.push(g);
    }
    while(gram.length<15){                       /* 생성이 막히면 손문항으로 채운다 */
      const r=GP[Math.floor(Math.random()*GP.length)];
      if(seen.has(r[0]))continue;
      seen.add(r[0]); gram.push(gap(r,"gram"));
    }
    shuffle(gram).forEach(g=>items.push(g));
    pick(VP,10).forEach(r=>items.push(gap(r,"vocab")));
    pickPassages(EXAM_READ,2,"read").forEach(p=>p.q.forEach(q=>items.push({sec:"read", passage:p,
      stem:q[0], ans:q[1], opts:shuffle([q[1],...q[2]]), why:"본문에서 근거를 찾으세요."})));
    pickPassages(EXAM_LISTEN,2,"listen").forEach(p=>p.q.forEach(q=>items.push({sec:"listen", audio:p,
      stem:q[0], ans:q[1], opts:shuffle([q[1],...q[2]]), why:"들은 내용을 다시 확인하세요."})));
  } finally { S.level=keepLv; }
  return items;
}
function startExam(){
  ex={items:buildExam(), i:0, answers:[], started:Date.now(),
      endsAt:Date.now()+EXAM_MIN*60000, done:false, recorded:false};
  if(ex.timer)clearInterval(ex.timer);
  ex.timer=setInterval(()=>{
    if(!ex||ex.done){clearInterval(ex.timer);return;}
    if(Date.now()>=ex.endsAt){ex.done=true;clearInterval(ex.timer);render();return;}
    const el=$("#exClock"); if(el)el.textContent=examClock();
  },1000);
  render();
}
function examClock(){
  if(!ex)return "";
  const left=Math.max(0,Math.floor((ex.endsAt-Date.now())/1000));
  return String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");
}
function examScore(){
  const by={}; EXAM_SECTIONS.forEach(s=>by[s.id]=[0,0]);
  ex.items.forEach((it,i)=>{by[it.sec][1]++; if(ex.answers[i]===it.ans)by[it.sec][0]++;});
  const tot=Object.values(by).reduce((a,b)=>[a[0]+b[0],a[1]+b[1]],[0,0]);
  const pct=Math.round(tot[0]/tot[1]*100);
  const sectionsOK=EXAM_SECTIONS.every(s=>by[s.id][0]/by[s.id][1]>=0.5);
  return {by, tot, pct, pass:sectionsOK&&pct>=60, sectionsOK};
}

  {id:"adj",  t:"형용사 변화표", d:"성·수·격 6칸 전체와 비교급·최상급."},
  {id:"pron", t:"대명사 변화표", d:"인칭대명사 7격과 소유대명사. 불규칙해 통째로 익힌다."},
  {id:"part", t:"형동사·부동사", d:"B2의 관문. 한 동사에서 네 갈래 형태가 갈라져 나옵니다.", lv:"B2"},
  {id:"drill",t:"어미 채우기 훈련", d:"동사·형용사를 섞어 무한 출제. 오답 보기는 같은 단어의 다른 형태."}

            cur:null, answered:false, run:[0,0], kinds:{verb:true,adj:true,part:false}};
const oPct=k=>{const s=S.odmStats[k];return s[1]?Math.round(s[0]/s[1]*100):null;};
function recordOdm(k,ok){const s=S.odmStats[k];s[1]++;if(ok)s[0]++;save();}

const TENSES=[
  {id:"pres", t:"현재",   pl:"Czas teraźniejszy"},
  {id:"past", t:"과거",   pl:"Czas przeszły"},

];
/* 시제별 [인칭 라벨, 형태] 목록 */
function verbRows(v,tense){
  if(tense==="pres") return ["ja","ty","on / ona / ono","my","wy","oni / one"].map((p,i)=>[p,v.pres[i]]);
  if(tense==="fut"){
    const f=futAll(v);
    return ["ja","ty","on / ona / ono","my","wy","oni / one"].map((p,i)=>[p,f[i]]);
  }
  if(tense==="imper") return [["ty",v.imper[0]],["my",v.imper[1]],["wy",v.imper[2]]];
  const arr=tense==="past"?pastAll(v):condAll(v);
  return PERSONS.map((p,i)=>[p,arr[i]]);
}
function viewOdm(v){
  if(oState.mode==="verb") return odmVerb(v);
  if(oState.mode==="adj")  return odmAdj(v);

  const rows=[["verb","동사 활용"],["adj","형용사 변화"]].concat(lvOK("B2")?[["part","형동사·부동사"]]:[]).map(([k,t])=>{

/* ---- 어미 채우기 훈련 ---- */
function makeOdmQ(){
  const on=["verb","adj"].concat(lvOK("B2")?["part"]:[]).filter(k=>oState.kinds[k]);
  if(!on.length)return null;
  const kind=on[Math.floor(Math.random()*on.length)];
  if(kind==="part"){
    for(let g=0;g<200;g++){
      const pv=PARTS[Math.floor(Math.random()*PARTS.length)];
      const cols=PARTCOLS.filter(c=>pv[c.k]!=="—");
      if(!cols.length)continue;
      const c=cols[Math.floor(Math.random()*cols.length)];
      const ans=pv[c.k];
      const alt=new Set();
      PARTS.forEach(x=>PARTCOLS.forEach(cc=>{if(x[cc.k]!=="—")alt.add(x[cc.k]);}));
      PARTCOLS.forEach(cc=>{if(pv[cc.k]!=="—")alt.add(pv[cc.k]);});
      const d=distractors([...alt],ans,3);
      if(d.length<3)continue;
      return {kind:"part", stem:`${pv.inf} — ${c.t}`, word:pv.inf, ko:pv.ko,
        ans, opts:shuffle([ans,...d]), say:ans,
        note:`${pv.inf} (${pv.ko}) · ${c.t} = ${ans} — ${c.d}`, cc:2};
    }
    return null;
  }
  if(kind==="verb"){
    const pool=VERBS.filter(x=>lvOK(x.lv));
    for(let g=0;g<200;g++){
      const vb=pool[Math.floor(Math.random()*pool.length)];
      const opts=["pres","past","fut","cond"].concat(vb.imper[0]!=="—"?["imper"]:[]);
      const tn=opts[Math.floor(Math.random()*opts.length)];
      const rows=verbRows(vb,tn);
      const idx=Math.floor(Math.random()*rows.length);
      const ans=rows[idx][1];
      if(!ans||ans==="—")continue;
      const alt=new Set();
      rows.forEach(r=>alt.add(r[1]));
      ["pres","past","fut","cond"].forEach(o=>{if(o!==tn)verbRows(vb,o).forEach(r=>alt.add(r[1]));});
      const d=distractors([...alt],ans,3);
      if(d.length<3)continue;
      return {kind:"verb", stem:`${vb.inf} — ${TENSES.find(x=>x.id===tn).t} · ${rows[idx][0]}`,
        word:vb.inf, ko:vb.ko, ans, opts:shuffle([ans,...d]),
        note:`${vb.inf} (${vb.ko}) · ${TENSES.find(x=>x.id===tn).t} ${rows[idx][0]} = ${ans}`, say:ans};
    }
    return null;
  }
  const pool=ADJS.filter(x=>lvOK(x.lv));
  for(let g=0;g<200;g++){
    const ad=pool[Math.floor(Math.random()*pool.length)];
    const t=declAdj(ad), keys=["mi","ma","f","n","pp","po"];
    const ki=Math.floor(Math.random()*keys.length), ci=Math.floor(Math.random()*6);
    const ans=t[keys[ki]][ci];
    const alt=new Set(); keys.forEach(k=>t[k].forEach(f=>alt.add(f)));
    const d=distractors([...alt],ans,3);
    if(d.length<3)continue;
    return {kind:"adj", stem:`${ad.base} — ${ADJCOLS[ki]} · ${CASES[ci].ko}`,
      word:ad.base, ko:ad.ko, ans, opts:shuffle([ans,...d]),
      note:`${ad.base} (${ad.ko}) · ${ADJCOLS[ki]} ${CASES[ci].ko} = ${ans}`, say:ans, cc:ci+1};
  }
  return null;
}
function odmDrill(v){
  if(!oState.cur){oState.cur=makeOdmQ();oState.answered=false;}
  const q=oState.cur, acc=oState.run[1]?Math.round(oState.run[0]/oState.run[1]*100):0;
  v.innerHTML=`
  <div class="inline" style="margin:22px 0 14px"><button class="icon-btn" id="oback">← 어미</button>
    <b style="font-size:15px">어미 채우기 훈련</b>
    <span class="mono" style="margin-left:auto;font-size:13px;color:var(--ink-3)">${oState.run[0]} / ${oState.run[1]} · ${acc}%</span></div>
  <div class="card pad" style="margin-bottom:14px">
    <div class="eyebrow" style="margin-bottom:10px">연습할 품사</div>
    <div class="preps" style="gap:8px">
      ${[["verb","동사","--c5"],["adj","형용사","--c3"]].concat(lvOK("B2")?[["part","형동사·부동사","--c2"]]:[]).map(([k,t,c])=>`<span data-ok="${k}" role="button" tabindex="0"
        style="cursor:pointer;font-family:var(--font-ui);font-size:13.5px;
        border-color:${oState.kinds[k]?`var(${c})`:"var(--line)"};
        background:${oState.kinds[k]?`color-mix(in srgb,var(${c}) 12%,transparent)`:"transparent"};
        color:${oState.kinds[k]?`var(${c})`:"var(--ink-3)"}">${t}</span>`).join("")}
    </div>
  </div>
  ${!q?`<div class="card pad"><p class="lede" style="margin:0">연습할 품사를 하나 이상 골라 주세요.</p></div>`
  :`<div class="card pad" style="--cc:var(--c${q.cc||5})">
    <div class="qstem">${esc(q.stem)}</div>
    <div class="qword small pl">${esc(q.word)}</div>
    <div style="margin:-16px 0 22px;color:var(--ink-3);font-size:14px">${esc(q.ko)}</div>
    <div class="opts">${q.opts.map((o,i)=>`<button data-o="${i}"><span class="k">${i+1}</span>
      <span class="pl" style="font-size:17px;font-weight:600">${esc(o)}</span></button>`).join("")}</div>
    <div id="ofb"></div></div>`}`;
  $("#oback").onclick=()=>{oState.mode=null;render();window.scrollTo(0,0);};
  v.querySelectorAll("[data-ok]").forEach(b=>{
    const go=()=>{oState.kinds[b.dataset.ok]=!oState.kinds[b.dataset.ok];oState.cur=null;render();};
    b.onclick=go; b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}};});
  if(!q)return;
  v.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
    if(oState.answered)return; oState.answered=true;
    const chosen=q.opts[+b.dataset.o], ok=chosen===q.ans;
    oState.run[1]++; if(ok)oState.run[0]++;
    recordOdm(q.kind,ok);
    v.querySelectorAll("[data-o]").forEach(x=>{x.disabled=true;
      const t=q.opts[+x.dataset.o];
      if(t===q.ans)x.classList.add("right"); else if(x===b)x.classList.add("wrong");});
    $("#ofb").innerHTML=`<div class="qfeed ${ok?"ok":"no"}">
      <div style="font-weight:700;color:${ok?"var(--good)":"var(--bad)"};margin-bottom:4px">
        ${ok?"정답":"오답 — 정답은 "+esc(q.ans)}</div>
      <b>${esc(q.note)}</b>
      <div class="inline" style="margin-top:12px">
        <button class="btn" id="onext">다음 →</button>
        <button class="icon-btn" data-say="${esc(q.say)}">🔊 듣기</button>
        <button class="icon-btn" id="osee">이 단어 전체 표 보기</button>
      </div></div>`;
    const nx=()=>{document.removeEventListener("keydown",h);oState.cur=null;render();};
    $("#onext").onclick=nx;
    $("#osee").onclick=()=>{document.removeEventListener("keydown",h);
      if(q.kind==="verb"){oState.verb=q.word;oState.mode="verb";}
      else if(q.kind==="part"){oState.part=q.word;oState.mode="part";}
      else{oState.adj=q.word;oState.mode="adj";}
      oState.q="";render();window.scrollTo(0,0);};
    const h=e=>{if(e.key==="Enter"){e.preventDefault();nx();}};
    document.addEventListener("keydown",h);
  });
}

/* 모드별 문항 생성 */
function makeNumQ(mode,max){
  if(mode==="read"){
    const n=randomNum(max||1000);
    return {stem:"이 숫자를 폴란드어로?", big:`<span class="mono">${fmtNum(n)}</span>`,
      ans:numToPl(n), opts:shuffle([numToPl(n),...numDistract(n,3).map(numToPl)]),
      say:numToPl(n), note:`${fmtNum(n)} = ${numToPl(n)}`};
  }
  if(mode==="noun"){
    const P=NUM_NOUNS(); const d=P[Math.floor(Math.random()*P.length)];
    const n=DRILLNUMS[Math.floor(Math.random()*DRILLNUMS.length)];
    const ans=agreeForm(d,n), a=numAgree(n);
    const full=`${numWord(n,d.g)} ${ans}`;
    return {stem:`${numWord(n,d.g)} 뒤에 오는 형태는? — ${AGREE_KO[a]}`,
      big:`<span class="mono">${n}</span> × <span class="pl">${esc(d.p)}</span>`,
      ans, opts:nounOpts(d,ans), say:full,
      note:`${full} — ${n}${d.ko.replace(/ \(.*\)/,"")} · 끝자리 규칙에 따라 ${AGREE_KO[a]}`};
  }
  if(mode==="clock"){
    const h=1+Math.floor(Math.random()*12);
    const mins=[0,0,5,10,15,15,20,30,30,40,45,45,50];
    const m=mins[Math.floor(Math.random()*mins.length)];
    const ans=timeToPl(h,m);
    const alts=new Set();
    [[h,0],[h,15],[h,30],[h,45],[h===12?1:h+1,0],[h===1?12:h-1,30],[h,10],[h,50]]
      .forEach(([a,b])=>alts.add(timeToPl(a,b)));
    return {stem:"Która godzina? — 몇 시예요?", clock:[h,m],
      ans, opts:shuffle([ans,...distractors([...alts],ans,3)]), say:ans,
      note:`${timeKo(h,m)} — ${ans} · 몇 시에? ${atTimePl(h,m)}`};
  }
  /* date: 절반은 날짜, 절반은 요일 */
  if(Math.random()<.5){
    const i=Math.floor(Math.random()*7), d=DAYS[i];
    const others=DAYS.filter((_,j)=>j!==i).map(x=>x[1]);
    return {stem:"이 요일에 — 폴란드어로?", big:`<span style="font-weight:640">${d[2]}에</span>`,
      ans:d[1], opts:shuffle([d[1],...distractors(others,d[1],3)]), say:d[1],
      note:`${d[2]} = ${d[0]} · ~요일에 = ${d[1]} (w + 대격)`};
  }
  const mo=1+Math.floor(Math.random()*12), dd=1+Math.floor(Math.random()*MDAYS[mo-1]);
  const ans=dateToPl(dd,mo);
  const alts=new Set();
  while(alts.size<8){
    const m2=1+Math.floor(Math.random()*12), d2=1+Math.floor(Math.random()*28);
    if(m2!==mo||d2!==dd)alts.add(dateToPl(d2,m2));
  }
  alts.add(`${ORD_M[dd]} ${MONTHS[mo-1][1]}`);          /* 주격 서수 — 흔한 실수 */
  alts.add(`${ORD_M_GEN[dd]} ${MONTHS[mo-1][0]}`);      /* 월을 주격으로 — 흔한 실수 */
  return {stem:"이 날짜를 폴란드어로? (속격 서수 + 속격 월)", big:`<span style="font-weight:640">${dateKo(dd,mo)}</span>`,
    ans, opts:shuffle([ans,...distractors([...alts],ans,3)]), say:ans,
    note:`${dateKo(dd,mo)} = ${ans} · ${MONTHS[mo-1][0]} → ${MONTHS[mo-1][1]}`};
}

function numDrill(v){
  const rng=NRANGES.find(r=>r.id===nState.range)||NRANGES[1];
  if(!nState.cur){nState.cur=makeNumQ(nState.mode,rng.max);nState.answered=false;}
  const q=nState.cur, mode=NMODES.find(m=>m.id===nState.mode);
  const acc=nState.run[1]?Math.round(nState.run[0]/nState.run[1]*100):0;
  v.innerHTML=`
  <div class="inline" style="margin:22px 0 14px"><button class="icon-btn" id="nback">← 숫자·시간</button>
    <b style="font-size:15px">${mode.t}</b>
    <span class="mono" style="margin-left:auto;font-size:13px;color:var(--ink-3)">${nState.run[0]} / ${nState.run[1]} · ${acc}%</span></div>
  ${nState.mode==="read"?`<div class="card pad" style="margin-bottom:14px">
    <div class="eyebrow" style="margin-bottom:10px">숫자 범위</div>
    <div class="preps" style="gap:8px">${NRANGES.map(r=>`<span data-nr="${r.id}" role="button" tabindex="0"
      style="cursor:pointer;--cc:var(--c3);font-family:var(--font-ui);font-size:13.5px;
      border-color:${nState.range===r.id?"var(--c3)":"var(--line)"};
      background:${nState.range===r.id?"color-mix(in srgb,var(--c3) 12%,transparent)":"transparent"};
      color:${nState.range===r.id?"var(--c3)":"var(--ink-3)"}">${r.t}</span>`).join("")}</div>
  </div>`:""}
  <div class="card pad">
    <div class="qstem">${esc(q.stem)}</div>
    ${q.clock
      ? `<div style="display:flex;justify-content:center;margin:8px 0 28px">${clockSVG(q.clock[0],q.clock[1],176)}</div>`
      : `<div class="qword small">${q.big}</div>`}
    <div class="opts">${q.opts.map((o,i)=>`<button data-o="${i}"><span class="k">${i+1}</span>
      <span class="pl" style="font-size:17px;font-weight:600">${esc(o)}</span></button>`).join("")}</div>
    <div id="nfb"></div>
  </div>`;
  $("#nback").onclick=()=>{nState.mode=null;render();window.scrollTo(0,0);};
  v.querySelectorAll("[data-nr]").forEach(b=>{
    const go=()=>{nState.range=b.dataset.nr;nState.cur=null;render();};
    b.onclick=go; b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}};});
  v.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
    if(nState.answered)return; nState.answered=true;
    const chosen=q.opts[+b.dataset.o], ok=chosen===q.ans;
    nState.run[1]++; if(ok)nState.run[0]++;
    recordNum(nState.mode,ok);
    v.querySelectorAll("[data-o]").forEach(x=>{x.disabled=true;
      const t=q.opts[+x.dataset.o];
      if(t===q.ans)x.classList.add("right"); else if(x===b)x.classList.add("wrong");});
    $("#nfb").innerHTML=`<div class="qfeed ${ok?"ok":"no"}">
      <div style="font-weight:700;color:${ok?"var(--good)":"var(--bad)"};margin-bottom:4px">
        ${ok?"정답":"오답 — 정답은 "+esc(q.ans)}</div>
      <b>${esc(q.note)}</b>
      <div class="inline" style="margin-top:12px">
        <button class="btn" id="nnext">다음 →</button>
        <button class="icon-btn" data-say="${esc(q.say)}">🔊 듣기</button>
        <span style="font-size:12px;color:var(--ink-3)">Enter 로도 넘어갑니다</span>
      </div></div>`;
    const nx=()=>{document.removeEventListener("keydown",h);nState.cur=null;render();};
    $("#nnext").onclick=nx;
    const h=e=>{if(e.key==="Enter"){e.preventDefault();nx();}};
    document.addEventListener("keydown",h);
  });
}

/* ---- 모드 A: 격변화표 ---- */
function trainTable(v){
  const d=DECLMAP[tState.word]||DECL_ALL[0];
  const q=tState.q.trim().toLowerCase();
  const hits=q?DECL_ALL.filter(x=>x.p.toLowerCase().indexOf(q)>=0||x.ko.indexOf(tState.q.trim())>=0).slice(0,30):[];
  const hasPl=!!d.pl;

/* ---- 모드 B: 격 채우기 ---- */
function nextFill(){
  const on=Object.keys(tState.cases).filter(k=>tState.cases[k]).map(Number);
  if(!on.length){tState.cur=null;return;}
  const pool=tState.only?DECL_ALL.filter(d=>d.p===tState.only):DECL_ALL;
  for(let guard=0;guard<300;guard++){
    const d=pool[Math.floor(Math.random()*pool.length)];
    const ci=on[Math.floor(Math.random()*on.length)];
    const plural=tState.plural&&!!d.pl;
    if(!caseOK(d,ci,plural))continue;
    const ans=formOf(d,ci,plural);
    /* 주격을 그대로 답하는 문제는 학습이 안 된다 */
    if(ci!==1&&ans===d.sg[0]&&!plural&&ci!==4)continue;
    /* 형태가 겹치는 명사(muzeum 등)는 보기 4개를 못 만든다 */
    if(new Set(plural?d.pl:d.sg).size<4)continue;
    const dis=caseDistractors(d,ci,plural,3);
    if(dis.length<3)continue;
    tState.cur={d,ci,plural,ans,opts:shuffle([ans,...dis])};
    tState.answered=false; return;
  }
  tState.cur=null;
}
function trainFill(v){
  if(!tState.cur)nextFill();
  const on=Object.keys(tState.cases).filter(k=>tState.cases[k]).map(Number);
  const acc=tState.run[1]?Math.round(tState.run[0]/tState.run[1]*100):0;

  v.innerHTML=`
  <div class="inline" style="margin:22px 0 12px"><button class="icon-btn" id="tback">← 훈련</button>
    <b style="font-size:15px">격 채우기 훈련</b>

  <div class="card pad" style="margin-bottom:14px">
    <div class="eyebrow" style="margin-bottom:9px">연습할 격 고르기</div>
    <div class="preps" style="gap:7px">
      ${CASES.map(c=>`<span data-tc="${c.id}" role="button" tabindex="0" style="cursor:pointer;--cc:var(--c${c.id});
        border-color:${tState.cases[c.id]?`var(--c${c.id})`:"var(--line)"};

        color:${tState.cases[c.id]?`var(--c${c.id})`:"var(--ink-3)"};font-family:var(--font-ui);font-size:13px">
        ${c.ko}</span>`).join("")}
    </div>

        <input type="checkbox" id="tpl" ${tState.plural?"checked":""}> 복수형으로 연습</label>
      ${tState.only?`<span class="chip" style="margin-left:auto">${esc(tState.only)} 한 단어만
        <button class="icon-btn" id="tclear" style="padding:0 5px;margin-left:5px">✕</button></span>`:""}
    </div>
  </div>

  ${!on.length?`<div class="card pad"><p class="lede" style="margin:0">연습할 격을 하나 이상 골라 주세요.</p></div>`
  :!tState.cur?`<div class="card pad"><p class="lede" style="margin:0">고른 조건에 맞는 문제를 만들 수 없습니다. 격이나 복수 설정을 바꿔 보세요.</p></div>`
  :(()=>{const {d,ci,plural}=tState.cur, c=CASES.find(x=>x.id===ci), fr=frameBlank(ci,plural);
    return `<div class="card pad" style="--cc:var(--c${ci})">
    <div class="qstem"><span style="color:var(--c${ci});font-weight:700">${c.ko}</span> · ${c.pl}
      ${plural?'<span class="chip pl-t" style="margin-left:6px">복수</span>':""}</div>
    <div class="qword small pl">${esc(fr.pl)}</div>
    <div style="margin:-14px 0 20px;color:var(--ink-3);font-size:14px">${esc(fr.ko)} —
      <span class="pl" style="font-weight:600;color:var(--ink-2)">${esc(d.p)}</span> (${esc(d.ko)})</div>
    <div class="opts">${tState.cur.opts.map((o,i)=>`<button data-o="${i}"><span class="k">${i+1}</span>
      <span class="pl" style="font-size:18px;font-weight:600">${esc(o)}</span></button>`).join("")}</div>
    <div id="tfb"></div></div>`;})()}`;

  $("#tback").onclick=()=>{tState.mode=null;tState.only=null;render();window.scrollTo(0,0);};
  v.querySelectorAll("[data-tc]").forEach(b=>{
    const go=()=>{const id=+b.dataset.tc;tState.cases[id]=!tState.cases[id];tState.cur=null;render();};
    b.onclick=go; b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}};});
  const pl=$("#tpl"); if(pl)pl.onchange=()=>{tState.plural=pl.checked;tState.cur=null;render();};
  const cl=$("#tclear"); if(cl)cl.onclick=()=>{tState.only=null;tState.cur=null;render();};

  if(!tState.cur)return;
  v.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
    if(tState.answered)return; tState.answered=true;
    const {d,ci,plural,ans}=tState.cur, chosen=tState.cur.opts[+b.dataset.o], ok=chosen===ans;
    tState.run[1]++; if(ok)tState.run[0]++;

    v.querySelectorAll("[data-o]").forEach(x=>{x.disabled=true;

    /* 오답이면 그 형태가 실제로는 몇 격인지 알려 준다 */
    const wrongIdx=(plural?d.pl:d.sg).indexOf(chosen);
    const wrongIs=(!ok&&wrongIdx>=0)?`<div style="font-size:13px;color:var(--ink-3);margin-top:6px">
      고른 <span class="pl" style="font-weight:600">${esc(chosen)}</span>은(는)
      <span style="color:var(--c${wrongIdx+1});font-weight:600">${CASES[wrongIdx].ko}</span> 형태입니다.</div>`:"";
    $("#tfb").innerHTML=`<div class="qfeed ${ok?"ok":"no"}">
      <div style="font-weight:700;color:${ok?"var(--good)":"var(--bad)"};margin-bottom:4px">
        ${ok?"정답":"오답 — 정답은 "+esc(ans)}</div>
      <b>${esc(fr.pl)}</b> <span style="font-size:13px;color:var(--ink-3)">${esc(fr.ko)}</span>
      <div style="font-size:13px;color:var(--ink-3);margin-top:6px">

      ${wrongIs}
      ${(()=>{const ex=sentForCase(ci,1)[0];
        return ex?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">
          <div class="pl" style="font-size:15px">${markUp(ex.s.pl,ex.w)}</div>
          <div style="font-size:12.5px;color:var(--ink-3)">${esc(ex.s.ko)}</div></div>`:"";})()}
      <div class="inline" style="margin-top:12px">
        <button class="btn" id="tnext">다음 →</button>
        <button class="icon-btn" data-say="${esc(fr.pl)}">🔊 문장 듣기</button>

      tState.mode="table";tState.word=d.p;tState.q="";render();window.scrollTo(0,0);};
    const h=e=>{if(e.key==="Enter"){e.preventDefault();nx();}};
    document.addEventListener("keydown",h);
  });
}

const GENDERPOOL=ALLWORDS.filter(w=>["m","f","n"].includes(w.g));
function trainGender(v){
  if(!tState.gen){
    const w=GENDERPOOL[Math.floor(Math.random()*GENDERPOOL.length)];
    tState.gen={w,done:false};
  }
  const {w,done}=tState.gen;
  const acc=S.genStats[1]?Math.round(S.genStats[0]/S.genStats[1]*100):0;
  const hint={m:"자음으로 끝나면 대개 남성",f:"-a로 끝나면 대개 여성",n:"-o, -e, -ę, -um이면 중성"}[w.g];
  v.innerHTML=`
  <div class="inline" style="margin:22px 0 12px"><button class="icon-btn" id="tback">← 훈련</button>
    <b style="font-size:15px">성 판별 훈련</b>
    <span class="mono" style="margin-left:auto;font-size:13px;color:var(--ink-3)">
      연속 ${tState.genStreak} · 최고 ${S.genBest} · ${acc}%</span></div>
  <div class="card pad">
    <div class="qstem">이 명사의 성은?</div>
    <div class="qword pl">${esc(w.p)}
      <button class="icon-btn" data-say="${esc(w.p)}" style="vertical-align:middle;font-size:14px">🔊</button></div>
    <div class="opts" style="grid-template-columns:repeat(3,1fr)">
      ${["m","f","n"].map(g=>`<button data-g="${g}" style="justify-content:center;font-weight:600">
        ${GENDER_KO[g]}</button>`).join("")}
    </div>
    <div id="gfb"></div>
  </div>
  <p class="lede" style="margin-top:14px">키보드 <b>1 · 2 · 3</b>으로도 답할 수 있습니다. 성을 알아야 격변화도 형용사도 맞출 수 있습니다.</p>`;
  $("#tback").onclick=()=>{tState.mode=null;render();window.scrollTo(0,0);};
  const answer=g=>{
    if(tState.gen.done)return; tState.gen.done=true;
    const ok=g===w.g;
    recordGender(ok);
    if(ok){tState.genStreak++; if(tState.genStreak>S.genBest){S.genBest=tState.genStreak;save();}}
    else tState.genStreak=0;
    v.querySelectorAll("[data-g]").forEach(x=>{x.disabled=true;
      if(x.dataset.g===w.g)x.classList.add("right");
      else if(x.dataset.g===g)x.classList.add("wrong");});
    $("#gfb").innerHTML=`<div class="qfeed ${ok?"ok":"no"}">
      <div style="font-weight:700;color:${ok?"var(--good)":"var(--bad)"};margin-bottom:4px">
        ${ok?"정답":"오답 — "+esc(w.p)+"은(는) "+GENDER_KO[w.g]}</div>
      <b>${esc(w.p)}</b> — ${esc(w.k)}
      <div style="font-size:13px;color:var(--ink-3);margin-top:5px">${esc(hint)}</div>
      ${DECLMAP[w.p]?`<div style="font-size:13px;color:var(--ink-3);margin-top:4px">
        대격 <span class="pl" style="font-weight:600">${esc(DECLMAP[w.p].sg[3])}</span> ·
        전치격 <span class="pl" style="font-weight:600">${esc(DECLMAP[w.p].sg[5])}</span></div>`:""}
      <div class="inline" style="margin-top:12px"><button class="btn" id="gnext">다음 →</button></div></div>`;
    const nx=()=>{document.removeEventListener("keydown",h);tState.gen=null;render();};
    $("#gnext").onclick=nx;
    const h=e=>{if(e.key==="Enter"){e.preventDefault();nx();}};
    document.addEventListener("keydown",h);
  };
  v.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>answer(b.dataset.g));
  if(!done){
    const kh=e=>{
      if(route!=="train"||tState.mode!=="gender"||!tState.gen||tState.gen.done){
        document.removeEventListener("keydown",kh);return;}
      const map={"1":"m","2":"f","3":"n"};
      if(map[e.key]){document.removeEventListener("keydown",kh);answer(map[e.key]);}};
    document.addEventListener("keydown",kh);
  }
}

      <span class="mono">${h.score}/${h.total}</span>

    </div>`:""}`;

function makeQ(type){
  if(type==="meaning"){
    const w=ALLWORDS[Math.floor(Math.random()*TOTAL)];
    const others=distractors(ALLWORDS.map(x=>x.k),w.k,3);
    return {type,stem:"이 단어의 뜻은?",word:w.p,say:w.p,opts:shuffle([w.k,...others]),ans:w.k,
            note:w.n?`${w.p} — ${w.k} · ${w.n}`:`${w.p} — ${w.k}`,small:false};
  }
  if(type==="reverse"){
    const w=ALLWORDS[Math.floor(Math.random()*TOTAL)];
    const others=distractors(ALLWORDS.map(x=>x.p),w.p,3);
    return {type,stem:"폴란드어로는?",word:w.k,say:w.p,opts:shuffle([w.p,...others]),ans:w.p,plOpts:true,
            note:`${w.p} — ${w.k}`,small:true};
  }
  /* 숫자·시간 — 전용 탭과 같은 생성기를 재사용한다 */
  if(type==="numRead"||type==="numNoun"||type==="clock"){
    const mode={numRead:"read",numNoun:"noun",clock:Math.random()<.55?"clock":"date"}[type];
    /* 퀴즈에서는 작은 수를 자주, 큰 수를 가끔 — 난이도가 한쪽으로 쏠리지 않게 */
    const r=Math.random();
    const q=makeNumQ(mode, r<.45?1000:r<.8?1e6:1e9);
    return {type,stem:q.stem,word:q.clock?"":q.big.replace(/<[^>]+>/g,""),
            clock:q.clock,say:q.say,opts:q.opts,ans:q.ans,plOpts:true,
            note:q.note,small:true,numKey:mode};
  }
  /* 어미 변화 — 어미 탭과 같은 생성기를 재사용한다 */
  if(type==="conj"||type==="adjf"){
    const keep=oState.kinds;
    oState.kinds={verb:type==="conj",adj:type==="adjf"};
    const q=makeOdmQ(); oState.kinds=keep;
    if(q)return {type,stem:q.stem,word:q.word,say:q.say,opts:q.opts,ans:q.ans,plOpts:true,
                 note:q.note,small:true,cc:q.cc,odmKey:q.kind};
  }
  if(type==="aspect"){
    const p=ASPECT[Math.floor(Math.random()*ASPECT.length)];
    const askPerf=Math.random()<.5;
    const ans=askPerf?p[1]:p[0];
    const pool=ASPECT.map(x=>askPerf?x[1]:x[0]);
    return {type,stem:askPerf?"이 불완료상의 완료상 짝은?":"이 완료상의 불완료상 짝은?",
      word:askPerf?p[0]:p[1], say:ans, opts:shuffle([ans,...distractors(pool,ans,3)]), ans, plOpts:true,
      note:`${p[0]} (불완료) ↔ ${p[1]} (완료) — ${p[2]}`, small:true};
  }
  if(type==="compar"){
    const pool=ADJS.filter(a=>a.comp!=="—"&&lvOK(a.lv));
    const a=pool[Math.floor(Math.random()*pool.length)];
    const sup=Math.random()<.4;
    const ans=sup?a.sup:a.comp;
    const alt=pool.map(x=>sup?x.sup:x.comp);
    return {type,stem:sup?`${a.base} (${a.ko}) 의 최상급은?`:`${a.base} (${a.ko}) 의 비교급은?`,
      word:a.base, say:ans, opts:shuffle([ans,...distractors(alt,ans,3)]), ans, plOpts:true,
      note:`${a.base} → ${a.comp} → ${a.sup} · ${a.ko}`, small:false};
  }
  if(type==="part"){
    for(let g=0;g<200;g++){
      const pv=PARTS[Math.floor(Math.random()*PARTS.length)];
      const cols=PARTCOLS.filter(c=>pv[c.k]!=="—");
      if(!cols.length)continue;
      const c=cols[Math.floor(Math.random()*cols.length)];
      const ans=pv[c.k], alt=new Set();
      PARTS.forEach(x=>PARTCOLS.forEach(cc=>{if(x[cc.k]!=="—")alt.add(x[cc.k]);}));
      const d=distractors([...alt],ans,3);
      if(d.length<3)continue;
      return {type,stem:`${c.t} (${c.pl}) — 알맞은 형태는?`,word:pv.inf,say:ans,
        opts:shuffle([ans,...d]),ans,plOpts:true,small:false,
        note:`${pv.inf} (${pv.ko}) · ${c.t} = ${ans} — ${c.d}`,odmKey:"part"};
    }
  }
  if(type==="idiom"){
    const deck=DECKS.find(d=>d.id==="idiom");
    const w=deck.w[Math.floor(Math.random()*deck.w.length)];
    const alt=deck.w.map(x=>x[1]);
    return {type,stem:"이 관용구의 뜻은?",word:w[0],say:w[0],
      opts:shuffle([w[1],...distractors(alt,w[1],3)]),ans:w[1],small:true,
      note:`${w[0]} — ${w[1]}${w[3]?" · "+w[3]:""}`};
  }
  if(type==="register"){
    const r=REGISTER[1+Math.floor(Math.random()*(REGISTER.length-1))];
    const alt=REGISTER.slice(1).map(x=>x[1]);
    return {type,stem:`격식체로 바꾸면? — ${r[2]}`,word:r[0],say:r[1],
      opts:shuffle([r[1],...distractors(alt,r[1],3)]),ans:r[1],plOpts:true,small:false,
      note:`${r[0]} (구어) → ${r[1]} (격식) — ${r[2]}`};
  }
  if(type==="gender"){
    const w=GENDERPOOL[Math.floor(Math.random()*GENDERPOOL.length)];
    const dd=DECLMAP[w.p];
    return {type,stem:"이 명사의 성은?",word:w.p,say:w.p,
            opts:["남성","여성","중성"],ans:GENDER_KO[w.g],isGender:true,
            note:`${w.p} — ${w.k} · ${GENDER_KO[w.g]}`+
                 (dd?` · 대격 ${dd.sg[3]} · 전치격 ${dd.sg[5]}`:""),small:false};
  }
  /* 격 형태 고르기 — 절반은 손으로 쓴 문장, 절반은 격변화표에서 생성 */
  if(type==="case"){
    if(Math.random()<0.5){
      const d=CASEDRILLS[Math.floor(Math.random()*CASEDRILLS.length)];
      const c=CASES.find(x=>x.id===d.c);
      return {type,stem:`${c.ko} · ${c.pl} — 알맞은 형태는?`,word:d.s.replace("___","______")+`  [${d.b}]`,
              say:d.s.replace("___",d.a),opts:shuffle([d.a,...distractors(d.o,d.a,3)]),ans:d.a,plOpts:true,
              note:`${d.s.replace("___",d.a)} — ${d.ko}`,small:true,cc:d.c,caseId:d.c};
    }
    const g=randCaseItem();
    const fr=frameBlank(g.ci,g.plural), full=frameFill(g.ci,g.ans,g.plural);
    const c=CASES.find(x=>x.id===g.ci);
    return {type,stem:`${c.ko} · ${c.pl}${g.plural?" · 복수":""} — 알맞은 형태는?`,
            word:`${fr.pl}  [${g.d.p}]`,say:full.pl,
            opts:shuffle([g.ans,...caseDistractors(g.d,g.ci,g.plural,3)]),ans:g.ans,plOpts:true,
            note:`${full.pl} — ${full.ko} · ${g.d.p}(${g.d.ko})의 ${c.ko}`,small:true,cc:g.ci,caseId:g.ci};
  }
  /* 격변화 직접 입력 */
  if(type==="decline"){
    const g=randCaseItem();
    const fr=frameBlank(g.ci,g.plural), full=frameFill(g.ci,g.ans,g.plural);
    const c=CASES.find(x=>x.id===g.ci);
    return {type,stem:`${g.d.p} (${g.d.ko}) 를 ${c.ko}${g.plural?" 복수":""}으로`,
            word:fr.pl,say:full.pl,input:true,ans:g.ans,
            note:`${full.pl} — ${full.ko} · ${c.pl}`,small:true,cc:g.ci,caseId:g.ci};
  }
  /* 형태를 보고 격 이름 맞히기 */
  if(type==="caseId"){
    const g=randCaseItem(true);
    const full=frameFill(g.ci,g.ans,g.plural);
    const c=CASES.find(x=>x.id===g.ci);
    const others=distractors(CASES.filter(x=>x.id!==g.ci).map(x=>x.ko),c.ko,3);
    return {type,stem:`굵게 표시된 형태는 몇 격일까요? (기본형 ${g.d.p})`,
            word:full.pl.replace(g.ans,"《"+g.ans+"》"),say:full.pl,
            opts:shuffle([c.ko,...others]),ans:c.ko,
            note:`${full.pl} — ${full.ko} · ${c.pl} (${c.ko})`,small:true,cc:g.ci,caseId:g.ci};
  }
  /* 전치사가 지배하는 격 */
  if(type==="prep"){
    const p=PREPS[Math.floor(Math.random()*PREPS.length)];
    const c=CASES.find(x=>x.id===p[1]);
    const others=distractors(CASES.filter(x=>x.id!==p[1]).map(x=>x.ko),c.ko,3);
    return {type,stem:`이 전치사는 어떤 격을 요구할까요? — ${p[2]}`,word:p[0],say:p[0].split(" (")[0],
            opts:shuffle([c.ko,...others]),ans:c.ko,
            note:`${p[0]} + ${c.ko}(${c.pl}) — ${p[2]}`,small:false,cc:p[1],caseId:p[1]};
  }
  const d=VERBDRILLS[Math.floor(Math.random()*VERBDRILLS.length)];
  return {type:"verb",stem:"알맞은 동사 형태를 입력하세요",word:d[0].replace("___","______"),
          say:d[0].replace(/___\s*\([^)]*\)/,d[1]),input:true,ans:d[1],note:`${d[0].replace(/___\s*\([^)]*\)/,d[1])} — ${d[2]}`,small:true};
}
/* 격변화표에서 무작위 문항 하나 — 주격과 형태가 같아 학습이 안 되는 조합은 건너뛴다 */
function randCaseItem(allowSame){
  for(let guard=0;guard<400;guard++){
    const d=DECL_ALL[Math.floor(Math.random()*DECL_ALL.length)];
    const ci=2+Math.floor(Math.random()*6);            /* 2~7격 */
    const plural=!!d.pl&&Math.random()<0.25;
    if(!caseOK(d,ci,plural))continue;
    const ans=formOf(d,ci,plural);
    if(!allowSame&&ans===d.sg[0]&&!plural)continue;    /* 답이 기본형과 같으면 제외 */
    if(new Set((plural?d.pl:d.sg)).size<4)continue;    /* muzeum처럼 안 변하는 명사 제외 */
    return {d,ci,plural,ans};
  }
  const d=DECLMAP["kobieta"];
  return {d,ci:6,plural:false,ans:d.sg[5]};
}
const SEQS={
  mixed:  ["meaning","case","conj","numRead","decline","aspect","reverse","clock","caseId","adjf",
           "verb","numNoun","case","compar","prep","meaning"],
  caseMix:["case","decline","caseId","prep","case","decline","caseId","case","prep","decline","case","caseId"],
  odmMix: ["conj","adjf","aspect","compar","conj","adjf","aspect","conj","compar","adjf","conj","aspect"]
};
function startQuiz(type){
  const qs=[];
  let seq=SEQS[type]||Array(10).fill(type);
  if(type==="mixed"){                       /* 레벨이 높으면 상위 유형도 섞는다 */
    seq=seq.slice();
    if(lvOK("B2"))seq[3]="part";
    if(lvOK("C1")){seq[7]="idiom";seq[11]="register";}
  }
  const used=new Set();
  seq.forEach(t=>{let q,guard=0;do{q=makeQ(t);guard++;}while(used.has(q.word)&&guard<40);used.add(q.word);qs.push(q);});
  qz={type,qs,i:0,score:0,wrong:[],answered:false};
  render();
}
function quizQuestion(v){

         <button class="btn" id="qsub">확인</button></div>`

         <span class="${q.plOpts?"pl":""}" style="${q.plOpts?"font-size:18px;font-weight:600":""}">${esc(o)}</span></button>`).join("")}</div>`}
    <div id="qfb"></div>
  </div></div>`;
  $("#qexit").onclick=()=>{qz=null;render();};
  if(q.input){
    const inp=$("#qin"); inp.focus();
    const sub=()=>judge(inp.value,q,()=>{inp.disabled=true;$("#qsub").disabled=true;});
    $("#qsub").onclick=sub;
    inp.onkeydown=e=>{if(e.key==="Enter")sub();};
  }else{
    v.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
      const val=q.opts[+b.dataset.o];

          x.disabled=true;
          const t=q.opts[+x.dataset.o];
          if(t===q.ans)x.classList.add("right");
          else if(x===b)x.classList.add("wrong");
        });
      });
    });
  }
}
function judge(val,q,lock){
  if(qz.answered)return; qz.answered=true;
  const ok=norm(val)===norm(q.ans);
  if(ok)qz.score++; else qz.wrong.push({q,given:val||"(무응답)"});
  if(q.caseId)recordCase(q.caseId,ok);
  if(q.isGender)recordGender(ok);
  if(q.numKey)recordNum(q.numKey,ok);
  if(q.odmKey)recordOdm(q.odmKey,ok);
  lock();
  $("#qfb").innerHTML=`<div class="qfeed ${ok?"ok":"no"}">
    <div style="font-weight:700;color:${ok?"var(--good)":"var(--bad)"};margin-bottom:4px">${ok?"정답":"오답 — 정답은 "+esc(q.ans)}</div>
    <b>${esc(q.note)}</b>
    <div class="inline" style="margin-top:12px">
      <button class="btn" id="qnext">${qz.i+1>=qz.qs.length?"결과 보기":"다음 문제 →"}</button>
      <button class="icon-btn" data-say="${esc(q.say)}">🔊 다시 듣기</button>
      <span style="font-size:12px;color:var(--ink-3)">Enter 로도 넘어갑니다</span>
    </div></div>`;
  const next=()=>{qz.i++;qz.answered=false;render();};
  $("#qnext").onclick=next;
  const h=e=>{if(e.key==="Enter"){e.preventDefault();document.removeEventListener("keydown",h);next();}};
  document.addEventListener("keydown",h);
}
function quizResult(v){

  const msg=pct>=90?"거의 완벽합니다. 다음 격으로 넘어가세요."

    :pct>=40?"패턴은 잡혔습니다. 해당 격의 어미표를 한 번 더 보세요."
    :"아직 낯선 단계예요. 문법 레슨을 먼저 읽고 오면 훨씬 쉬워집니다.";

  <div class="card pad">${wrongs.map(w=>`<div class="wrongrow">
    <span class="pw">${esc(w.q.word)}</span>
    <span class="yr">${esc(w.given)}</span>
    <span class="cr">${esc(w.q.ans)}</span>
    <span style="flex-basis:100%;font-size:13px;color:var(--ink-3)">${esc(w.q.note)}</span>
  </div>`).join("")}</div>`:`<p class="lede" style="margin-top:18px">틀린 문제가 없습니다.</p>`}`;
  const t=qz.type;
  $("#qagain").onclick=()=>startQuiz(t);
  $("#qhome").onclick=()=>{qz=null;render();};
}

  const el=document.createElement("span");
  el.id="saveNote";
  el.style.color=si.tone==="ok"?"var(--good)":si.tone==="warn"?"var(--amber)":"var(--bad)";
  el.textContent="● "+si.t;
  const foot=document.querySelector(".foot");
  foot.insertBefore(el,foot.firstChild);
  const old=foot.querySelector("span:nth-child(2)");
  if(old&&old.textContent.indexOf("진도는")===0)old.remove();
})();

renderTabs();render();
</script>

     데스크톱에서는 아래 요소가 모두 숨겨지고 기존 상단 탭이 그대로 쓰인다.

<style>
/* ---- 색 구성표를 실제로 전환해 스크롤바·기본 컨트롤까지 따라오게 한다 ---- */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}

/* ---- 홈 화면 추가 안내 (iOS) / 업데이트 알림 ---- */

  .hero{padding:32px 22px 28px;margin-top:20px}

}
@media (min-width:761px){

}
@media (prefers-reduced-motion:reduce){

}

<script>
/* =========================================================================
   모바일 앱 레이어
   앱 스크립트가 만든 전역(TABS·setTab·render·renderTabs·route·S·Store·LEVELS)을
   그대로 쓰되, 원본 동작은 감싸기만 하고 바꾸지 않는다.
   ========================================================================= */
(function(){
  "use strict";
  const coarse = window.matchMedia("(pointer:coarse)");
  const LABEL  = {}; TABS.forEach(([id,l])=>LABEL[id]=l);
  const PRIMARY = ["home","vocab","grammar","train"];
  const MORE = [
    ["cases","격","7격의 쓰임과 어미표"],
    ["odm","어미","동사·형용사·분사 변화"],
    ["num","숫자","수사 · 시간 · 날짜"],
    ["quiz","퀴즈","격 · 성 · 어미 객관식"],
    ["exam","모의고사","실전 형식 종합 시험"]
  ];
  const ICON = {
    home:'<svg viewBox="0 0 24 24"><path d="M4 10.6 12 4l8 6.6V19a2 2 0 0 1-2 2h-3.5v-6h-5v6H6a2 2 0 0 1-2-2z"/></svg>',
    vocab:'<svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v17H6.5A2.5 2.5 0 0 0 4 22z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v17h5.5A2.5 2.5 0 0 1 20 22z"/></svg>',
    grammar:'<svg viewBox="0 0 24 24"><path d="M4 6h16M4 11h11M4 16h16"/></svg>',
    train:'<svg viewBox="0 0 24 24"><rect x="2.6" y="9.6" width="2.8" height="4.8" rx="1.2"/>'
          +'<rect x="18.6" y="9.6" width="2.8" height="4.8" rx="1.2"/>'
          +'<rect x="5.6" y="7.4" width="3.4" height="9.2" rx="1.5"/>'
          +'<rect x="15" y="7.4" width="3.4" height="9.2" rx="1.5"/><path d="M9 12h6"/></svg>',
    more:'<svg viewBox="0 0 24 24" stroke-width="2.6"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg>'
  };

  const nav   = document.getElementById("mnav");
  const sheet = document.getElementById("msheet");
  const bg    = document.getElementById("msheetbg");
  const a2hs  = document.getElementById("a2hs");
  const toast = document.getElementById("swtoast");
  [sheet,bg].forEach(el=>el.hidden=false);

  /* ---------------- 하단 탭 바 ---------------- */
  nav.innerHTML =
    PRIMARY.map(id=>`<button data-mtab="${id}" aria-current="false">${ICON[id]}<span class="ml">${LABEL[id]}</span></button>`).join("")
    + `<button id="mMore" data-more aria-current="false" aria-haspopup="dialog">${ICON.more}<span class="ml">더보기</span></button>`;

  nav.addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b)return;
    if(b.hasAttribute("data-more")){ sheetOpen(!sheet.classList.contains("open")); return; }
    sheetOpen(false);
    if(b.dataset.mtab!==route) setTab(b.dataset.mtab); else window.scrollTo({top:0,behavior:"smooth"});
  });

  /* ---------------- 더보기 시트 ---------------- */
  sheet.innerHTML = `<div class="grip"></div>
    <div class="ms-grid">${MORE.map(([id,t,s])=>
      `<button data-stab="${id}" aria-current="false"><b>${t}</b><small>${s}</small></button>`).join("")}</div>
    <div class="ms-label">학습 범위</div>
    <div class="ms-lv" id="msLv"></div>
    <div class="ms-label">설정</div>
    <div class="ms-tools">
      <button data-act="theme">테마 전환</button>
      <button data-act="install" hidden>앱으로 설치</button>
      <button data-act="reset">진도 초기화</button>
    </div>
    <p class="ms-note">진도는 이 기기의 브라우저에 저장됩니다. 홈 화면에 추가하면 오프라인에서도 열립니다.</p>`;

  function sheetOpen(on){
    sheet.classList.toggle("open",on);
    bg.classList.toggle("open",on);
    document.body.style.overflow = on ? "hidden" : "";
  }
  bg.addEventListener("click",()=>sheetOpen(false));
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&sheet.classList.contains("open"))sheetOpen(false); });

  sheet.addEventListener("click",e=>{
    const t=e.target.closest("[data-stab]");
    if(t){ sheetOpen(false); if(t.dataset.stab!==route) setTab(t.dataset.stab); return; }
    const lv=e.target.closest("[data-slv]");
    if(lv){ const real=document.querySelector('#lvPick [data-lv="'+lv.dataset.slv+'"]'); if(real)real.click(); return; }
    const a=e.target.closest("[data-act]"); if(!a)return;
    if(a.dataset.act==="theme"){ document.getElementById("themeBtn").click(); return; }
    if(a.dataset.act==="install"){ sheetOpen(false); askInstall(); return; }
    if(a.dataset.act==="reset"){ sheetOpen(false); setTimeout(()=>document.getElementById("resetBtn").click(),240); }
  });

  /* ---------------- 상태 동기화 ---------------- */
  /* 헤더 레벨 칩 — 상단 lvPick 은 모바일에서 숨기고 이 칩으로 대신한다 */
  const lvChip=document.createElement("button");
  lvChip.id="mLv"; lvChip.type="button"; lvChip.title="학습 범위 바꾸기";
  lvChip.addEventListener("click",()=>sheetOpen(!sheet.classList.contains("open")));
  (function(){
    const bar=document.querySelector(".top-in"), th=document.getElementById("themeBtn");
    if(bar) bar.insertBefore(lvChip, th||null);
  })();

  function sync(){
    const inMore = PRIMARY.indexOf(route)<0;
    lvChip.textContent = LVLABEL[S.level]||S.level;
    nav.querySelectorAll("[data-mtab]").forEach(b=>b.setAttribute("aria-current",String(b.dataset.mtab===route)));
    const more=nav.querySelector("#mMore");
    more.setAttribute("aria-current",String(inMore));
    more.querySelector(".ml").textContent = inMore ? (LABEL[route]||"더보기") : "더보기";
    sheet.querySelectorAll("[data-stab]").forEach(b=>b.setAttribute("aria-current",String(b.dataset.stab===route)));
    sheet.querySelector("#msLv").innerHTML = LEVELS.map(l=>
      `<button data-slv="${l}" aria-current="${S.level===l}">${l}</button>`).join("");
  }

  const _renderTabs = renderTabs;
  renderTabs = function(){ _renderTabs.apply(this,arguments); sync(); };
  const _render = render;
  render = function(){ _render.apply(this,arguments); afterRender(); };

  /* ---------------- 단어 카드 스와이프 채점 ---------------- */
  let swipeGuard = 0;
  document.addEventListener("click",e=>{
    if(swipeGuard && Date.now()-swipeGuard<600 && e.target.closest("#flash")){
      e.stopPropagation(); e.preventDefault();
    }
  },true);

  function afterRender(){
    /* 채점 버튼이 떠 있는 동안에는 본문 아래에 자리를 비워 둔다 */
    document.body.classList.toggle("has-rowbtns", !!document.querySelector(".rowbtns"));
    if(!coarse.matches) return;
    const el=document.getElementById("flash");
    if(el) enhanceFlash(el);
  }

  function enhanceFlash(el){
    const know=document.getElementById("know"), dunno=document.getElementById("dunno");
    const flipped = !!(know && !know.disabled);
    const hint=el.querySelector(".hint");
    if(hint) hint.textContent = flipped ? "→ 밀면 알아요 · ← 밀면 헷갈려요" : "탭하면 뜻이 보입니다";
    let sx=0,sy=0,dx=0,drag=false;
    el.addEventListener("touchstart",e=>{
      if(e.touches.length!==1)return;
      sx=e.touches[0].clientX; sy=e.touches[0].clientY; dx=0; drag=false;
      el.style.transition="none";
    },{passive:true});
    el.addEventListener("touchmove",e=>{
      if(!flipped||e.touches.length!==1)return;
      const ax=e.touches[0].clientX-sx, ay=e.touches[0].clientY-sy;
      if(!drag && Math.abs(ax)>12 && Math.abs(ax)>Math.abs(ay)*1.3) drag=true;
      if(!drag)return;
      dx=ax;
      el.style.transform="translateX("+(ax*.72).toFixed(1)+"px) rotate("+(ax*.02).toFixed(2)+"deg)";
      el.style.borderColor = ax>0
        ? "color-mix(in srgb,var(--good) 55%,transparent)"
        : "color-mix(in srgb,var(--bad) 55%,transparent)";
    },{passive:true});
    const release=()=>{
      el.style.transition="transform .2s ease,border-color .2s ease,opacity .18s ease";
      if(drag && Math.abs(dx)>70){
        const right = dx>0;
        swipeGuard = Date.now();
        el.style.transform="translateX("+(right?110:-110)+"vw) rotate("+(right?8:-8)+"deg)";
        el.style.opacity="0";
        const target = right ? know : dunno;
        setTimeout(()=>{ if(target) target.click(); },130);
      }else{
        if(drag) swipeGuard = Date.now();
        el.style.transform=""; el.style.borderColor="";
      }
      drag=false; dx=0;
    };
    el.addEventListener("touchend",release,{passive:true});
    el.addEventListener("touchcancel",release,{passive:true});
  }

  /* ---------------- 주소로 화면 기억하기 ----------------
     저장소가 막혀 주소에 진도(#p=)를 싣는 환경에서는 건드리지 않는다. */
  const validTab = t => TABS.some(x=>x[0]===t);
  const _setTab = setTab;
  setTab = function(t){ _setTab(t); writeRoute(t); };
  function writeRoute(t){
    if(Store.mode==="memory")return;
    const want="#/"+t;
    if(location.hash===want)return;
    try{ history.pushState({t:t},"",want); }catch(e){}
  }
  window.addEventListener("popstate",()=>{
    if(location.hash.indexOf("#/")!==0)return;
    const t=location.hash.slice(2);
    if(validTab(t)&&t!==route){ sheetOpen(false); _setTab(t); }
  });

  /* ---------------- 설치 안내 ---------------- */
  let deferred=null;
  const installBtn = sheet.querySelector('[data-act="install"]');
  window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferred=e; installBtn.hidden=false; });
  window.addEventListener("appinstalled",()=>{ deferred=null; installBtn.hidden=true; a2hs.classList.remove("show"); });
  function askInstall(){
    if(!deferred)return;
    deferred.prompt();
    const done=()=>{ deferred=null; installBtn.hidden=true; };
    if(deferred.userChoice&&deferred.userChoice.then) deferred.userChoice.then(done,done); else done();
  }

  const standalone = (window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)
                     || navigator.standalone===true;
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent)
                || (navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const HIDE_KEY="polski_a2hs_off";
  const flag={
    get(){ try{return localStorage.getItem(HIDE_KEY);}catch(e){return null;} },
    set(){ try{localStorage.setItem(HIDE_KEY,"1");}catch(e){} }
  };
  if(isIOS && !standalone && !flag.get() && coarse.matches){
    a2hs.innerHTML = `<span style="flex:1"><b>앱처럼 쓰기</b> — 공유 메뉴에서
      <b>홈 화면에 추가</b>를 누르면 오프라인에서도 열립니다.</span>
      <button class="x" aria-label="닫기">✕</button>`;
    a2hs.querySelector("button").onclick=()=>{ a2hs.classList.remove("show"); flag.set(); };
    setTimeout(()=>a2hs.classList.add("show"),1200);
    setTimeout(()=>a2hs.classList.remove("show"),13000);
  }

  /* ---------------- 서비스 워커 (오프라인) ---------------- */
  let updating=false;
  if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
    window.addEventListener("load",()=>{
      navigator.serviceWorker.register("sw.js").then(reg=>{
        if(reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);
        reg.addEventListener("updatefound",()=>{
          const w=reg.installing; if(!w)return;
          w.addEventListener("statechange",()=>{
            if(w.state==="installed" && navigator.serviceWorker.controller) offerUpdate(w);
          });
        });
      }).catch(()=>{});
      navigator.serviceWorker.addEventListener("controllerchange",()=>{
        if(updating){ updating=false; location.reload(); }
      });
    });
  }
  function offerUpdate(worker){
    toast.innerHTML = `<span style="flex:1"><b>새 버전이 있습니다.</b> 지금 받으시겠어요?</span>
      <button data-go>업데이트</button><button class="x" aria-label="닫기">✕</button>`;
    toast.querySelector("[data-go]").onclick=()=>{ updating=true; toast.classList.remove("show"); worker.postMessage({type:"SKIP_WAITING"}); };
    toast.querySelector(".x").onclick=()=>toast.classList.remove("show");
    toast.classList.add("show");
  }

  /* ---------------- 첫 화면 ---------------- */
  (function(){
    const t = location.hash.indexOf("#/")===0 ? location.hash.slice(2) : "";
    if(validTab(t) && t!==route) _setTab(t);
    else sync();
  })();
})();
</script>
</body>
</html>
